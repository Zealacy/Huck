<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacific Huck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one arcade screen. A 16:9 pixel field scaled to fit the window, with chunky menus floating over it. Single dark look by choice. */
:root{
  --night:#14202e;
  --panel:#1f3044;
  --panel-2:#2b4560;
  --line:#7a95b0;
  --chalk:#f3efe2;
  --dim:#a9b8c6;
  --sunset:#ff8f3d;
  --sunset-deep:#b8541a;
  --sea:#6fd0c1;
  --gold:#ffd25a;
  --red:#ff6b5d;
  --ink:#0b121a;
  --grass:#4a9a50;
  --scrim:rgba(11,18,26,.82);
  --shadow:rgba(0,0,0,.4);
  --font-display:"Silkscreen","Courier New",monospace;
  --font-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#wrap{height:100%;width:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:960px;height:540px;--u:1px;flex:none;
  box-shadow:0 0 0 calc(var(--u)*4) var(--panel-2),0 calc(var(--u)*14) calc(var(--u)*40) var(--shadow)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;background:var(--ink)}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*16);line-height:1.3}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);pointer-events:auto}
.screen.clear{background:linear-gradient(180deg,transparent 0%,transparent 35%,var(--scrim) 100%)}
.panel{background:var(--panel);border:calc(var(--u)*3) solid var(--line);
  box-shadow:inset 0 0 0 calc(var(--u)*3) var(--panel-2),calc(var(--u)*6) calc(var(--u)*6) 0 var(--shadow);
  padding:calc(var(--u)*18) calc(var(--u)*22);max-height:calc(100% - var(--u)*28);max-width:calc(100% - var(--u)*28);
  box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:calc(var(--u)*12)}
.panel::-webkit-scrollbar{width:calc(var(--u)*8)}
.panel::-webkit-scrollbar-thumb{background:var(--line)}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance;letter-spacing:.02em}
h2{font-size:calc(var(--u)*26)}
h3{font-size:calc(var(--u)*15);color:var(--gold)}
p{margin:0}
.eyebrow{font-family:var(--font-display);font-size:calc(var(--u)*11);letter-spacing:.12em;text-transform:uppercase;color:var(--sea)}
.dim{color:var(--dim)}
.row{display:flex;gap:calc(var(--u)*10);align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.btn{font-family:var(--font-display);font-weight:700;font-size:calc(var(--u)*15);background:var(--sunset);color:var(--ink);border:0;
  padding:calc(var(--u)*9) calc(var(--u)*16);cursor:pointer;box-shadow:0 calc(var(--u)*4) 0 var(--sunset-deep);
  position:relative;top:0;letter-spacing:.04em;text-transform:uppercase}
.btn:hover{filter:brightness(1.08)}
.btn:active{top:calc(var(--u)*3);box-shadow:0 calc(var(--u)*1) 0 var(--sunset-deep)}
.btn:focus-visible,.tile:focus-visible,.pos-card:focus-visible,.plus:focus-visible,input:focus-visible{outline:calc(var(--u)*3) solid var(--gold);outline-offset:calc(var(--u)*2)}
.btn.alt{background:var(--panel-2);color:var(--chalk);box-shadow:0 calc(var(--u)*4) 0 var(--ink)}
.btn.small{font-size:calc(var(--u)*12);padding:calc(var(--u)*6) calc(var(--u)*10)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.kbd{font-family:var(--font-display);font-size:.8em;background:var(--chalk);color:var(--ink);padding:0 calc(var(--u)*5);box-shadow:0 calc(var(--u)*2) 0 var(--line);white-space:nowrap}
/* title */
.titlebox{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14);margin-top:calc(var(--u)*120)}
.logo{font-family:var(--font-display);font-weight:700;line-height:.9;text-align:center;color:var(--chalk);
  text-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 var(--sunset-deep),calc(var(--u)*8) calc(var(--u)*8) 0 var(--ink)}
.logo .a{display:block;font-size:calc(var(--u)*30);letter-spacing:.3em;color:var(--sea);text-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 var(--ink)}
.logo .b{display:block;font-size:calc(var(--u)*92);letter-spacing:.04em;color:var(--sunset)}
.tag{font-size:calc(var(--u)*18);color:var(--chalk);text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
.menu{display:flex;gap:calc(var(--u)*12);flex-wrap:wrap;justify-content:center}
.foot{font-size:calc(var(--u)*13);color:var(--dim);text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
/* team picker */
.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*14)}
.state-col{display:flex;flex-direction:column;gap:calc(var(--u)*6);min-width:0}
.tile{display:flex;align-items:center;gap:calc(var(--u)*10);background:var(--panel-2);border:0;color:var(--chalk);text-align:left;
  padding:calc(var(--u)*7) calc(var(--u)*9);cursor:pointer;font-family:var(--font-body);font-size:calc(var(--u)*15);box-shadow:0 calc(var(--u)*3) 0 var(--ink)}
.tile:hover{background:var(--line);color:var(--ink)}
.tile[disabled]{opacity:.3;cursor:not-allowed}
.tile small{display:block;font-size:calc(var(--u)*12);color:inherit;opacity:.75}
.jersey{width:calc(var(--u)*22);height:calc(var(--u)*24);flex:none;position:relative}
.jersey i{position:absolute;left:0;right:0;top:0;height:62%}
.jersey b{position:absolute;left:15%;right:15%;bottom:0;height:34%}
/* pregame */
.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:calc(var(--u)*16);align-items:start}
.vs{font-family:var(--font-display);font-size:calc(var(--u)*30);color:var(--sunset);align-self:center}
.side{display:flex;flex-direction:column;gap:calc(var(--u)*6);min-width:0}
.side.right{text-align:right;align-items:flex-end}
.side h2{font-size:calc(var(--u)*22)}
.ratings{font-family:var(--font-display);font-size:calc(var(--u)*12);color:var(--dim);font-variant-numeric:tabular-nums}
.ratings b{color:var(--chalk)}
.star-list{display:flex;flex-direction:column;gap:calc(var(--u)*3);font-size:calc(var(--u)*14)}
.stars{color:var(--gold);letter-spacing:.06em;font-family:var(--font-body)}
.conditions{font-size:calc(var(--u)*14);color:var(--dim);border-top:calc(var(--u)*2) dashed var(--panel-2);padding-top:calc(var(--u)*10)}
/* offense style picker */
.stylepick{display:flex;flex-direction:column;gap:calc(var(--u)*5)}
.stylepick.ro{flex-direction:row;align-items:center;gap:calc(var(--u)*12)}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(var(--u)*6)}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3);background:var(--panel-2);border:calc(var(--u)*2) solid transparent;color:var(--chalk);
  font-family:var(--font-body);font-size:calc(var(--u)*13);white-space:nowrap;padding:calc(var(--u)*4);cursor:pointer;min-width:0}
.sbtn svg{width:100%;max-width:calc(var(--u)*92);height:auto;display:block}
.sbtn.on{border-color:var(--gold);background:var(--ink)}.sbtn.on b{color:var(--gold)}
.sbtn:focus-visible{outline:calc(var(--u)*2) solid var(--gold)}
.stylepick.compact .sgrid{gap:calc(var(--u)*5)}.stylepick.compact .sbtn{font-size:calc(var(--u)*11);padding:calc(var(--u)*3)}
.stylepick.ro .sbtn{width:calc(var(--u)*92);flex:none;cursor:default}
.sd-f{fill:var(--grass)}.sd-h{fill:var(--gold)}.sd-c{fill:var(--sea)}.sd-d{fill:var(--chalk)}
/* tables */
table{border-collapse:collapse;width:100%;font-size:calc(var(--u)*14);font-variant-numeric:tabular-nums}
th{font-family:var(--font-display);font-size:calc(var(--u)*10);color:var(--sea);text-align:left;padding:calc(var(--u)*3) calc(var(--u)*6);letter-spacing:.08em}
td{padding:calc(var(--u)*3) calc(var(--u)*6);border-top:calc(var(--u)*1) solid var(--panel-2)}
td.n,th.n{text-align:right;white-space:nowrap}
td.trunc{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.me td{background:var(--panel-2);color:var(--gold)}
/* how-to */
.how{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--u)*18);max-width:calc(var(--u)*780)}
.how ul{margin:0;padding-left:calc(var(--u)*18);display:flex;flex-direction:column;gap:calc(var(--u)*6);font-size:calc(var(--u)*15)}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*8) calc(var(--u)*12);font-size:calc(var(--u)*15);align-items:center}
/* defense */
.dpanel{width:calc(var(--u)*560)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*10)}
.choice{background:var(--panel-2);border:0;color:var(--chalk);text-align:left;padding:calc(var(--u)*10) calc(var(--u)*12);cursor:pointer;
  font-family:var(--font-body);font-size:calc(var(--u)*14);display:flex;flex-direction:column;gap:calc(var(--u)*4);box-shadow:0 calc(var(--u)*3) 0 var(--ink)}
.choice b{font-family:var(--font-display);font-size:calc(var(--u)*15);color:var(--gold)}
.choice:hover,.choice:focus-visible{background:var(--line);color:var(--ink);outline:none}
.choice:hover b,.choice:focus-visible b{color:var(--ink)}
.ticker{font-size:calc(var(--u)*16);display:flex;flex-direction:column;gap:calc(var(--u)*5);min-height:calc(var(--u)*130)}
.ticker p{animation:tick .25s steps(3) both}
.ticker .big{font-family:var(--font-display);font-size:calc(var(--u)*20)}
.good{color:var(--sea)}.bad{color:var(--red)}.gold{color:var(--gold)}
@keyframes tick{from{opacity:0;transform:translateX(calc(var(--u)*-8))}to{opacity:1;transform:none}}
/* program hub */
.hub{width:calc(var(--u)*900)}
.hub-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:calc(var(--u)*14)}
.card{background:var(--ink);padding:calc(var(--u)*12) calc(var(--u)*14);display:flex;flex-direction:column;gap:calc(var(--u)*9);min-width:0}
.attr{display:grid;grid-template-columns:calc(var(--u)*78) minmax(0,1fr) calc(var(--u)*22) calc(var(--u)*64);gap:calc(var(--u)*8);align-items:center;font-size:calc(var(--u)*14)}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:calc(var(--u)*2);height:calc(var(--u)*12)}
.pips span{background:var(--panel-2)}
.pips span.on{background:var(--sea)}
.attr .v{font-family:var(--font-display);text-align:right}
.plus{font-family:var(--font-display);font-size:calc(var(--u)*11);background:var(--gold);color:var(--ink);border:0;padding:calc(var(--u)*4) calc(var(--u)*4);cursor:pointer;white-space:nowrap}
.plus[disabled]{background:var(--panel-2);color:var(--dim);cursor:not-allowed}
.xpbar{height:calc(var(--u)*8);background:var(--panel-2);position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
.sp{font-family:var(--font-display);font-size:calc(var(--u)*13);color:var(--gold)}
.sched{display:flex;flex-direction:column;gap:calc(var(--u)*2);font-size:calc(var(--u)*14)}
.sched div{display:grid;grid-template-columns:calc(var(--u)*28) minmax(0,1fr) auto;gap:calc(var(--u)*8);padding:calc(var(--u)*2) calc(var(--u)*4)}
.sched div.next{background:var(--panel-2);color:var(--gold)}
.sched div span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextbox{background:var(--panel-2);padding:calc(var(--u)*10) calc(var(--u)*12);display:flex;flex-direction:column;gap:calc(var(--u)*8)}
.nextbox .big{font-family:var(--font-display);font-size:calc(var(--u)*18)}
input{font-family:var(--font-body);font-size:calc(var(--u)*17);background:var(--ink);color:var(--chalk);border:calc(var(--u)*2) solid var(--line);padding:calc(var(--u)*6) calc(var(--u)*8);width:100%;box-sizing:border-box}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--u)*16)}
/* head coach */
.hub-grid.coach{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
table.roster{font-size:calc(var(--u)*12.5)}
table.roster td{padding:calc(var(--u)*1) calc(var(--u)*4)}
table.roster th{padding:calc(var(--u)*2) calc(var(--u)*4)}
table.roster .stars{font-size:calc(var(--u)*11);letter-spacing:0;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td,tr.click:focus-visible td{background:var(--panel-2)}
tr.click:focus-visible{outline:calc(var(--u)*2) solid var(--gold)}
td.pos{font-family:var(--font-display);font-size:calc(var(--u)*11);color:var(--sea)}
.stars.ceil{color:var(--line)}
.ccbadge{font-family:var(--font-display);font-size:calc(var(--u)*14);background:var(--gold);color:var(--ink);padding:calc(var(--u)*6) calc(var(--u)*10);white-space:nowrap}
.tagO,.tagD{font-family:var(--font-display);font-size:calc(var(--u)*10);padding:0 calc(var(--u)*3);margin-right:calc(var(--u)*2);color:var(--ink)}
.tagO{background:var(--sea)}.tagD{background:var(--sunset)}
.small{font-size:calc(var(--u)*12)}
.rename{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto auto;gap:calc(var(--u)*8);align-items:end;margin-top:calc(var(--u)*4)}
.rename label{display:flex;flex-direction:column;gap:calc(var(--u)*3);font-size:calc(var(--u)*12);color:var(--dim);min-width:0}
.tog{font-family:var(--font-display);font-size:calc(var(--u)*11);background:var(--panel-2);color:var(--dim);border:0;padding:calc(var(--u)*3) calc(var(--u)*10);cursor:pointer}
.tog.o.on{background:var(--sea);color:var(--ink)}.tog.d.on{background:var(--sunset);color:var(--ink)}
.tog:focus-visible{outline:calc(var(--u)*2) solid var(--gold)}
.fac-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*12)}
.fac{background:var(--ink);padding:calc(var(--u)*12);display:flex;flex-direction:column;gap:calc(var(--u)*8);min-width:0}
.fac .btn{margin-top:auto;align-self:flex-start}
.lvl{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*3);height:calc(var(--u)*10)}
.lvl span{background:var(--panel-2)}.lvl span.on{background:var(--gold)}
/* line calls */
.lcpanel{width:calc(var(--u)*900)}
.lc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--u)*4) calc(var(--u)*12)}
.lc-list{display:grid;gap:calc(var(--u)*4)}
.lc{display:grid;grid-template-columns:calc(var(--u)*30) minmax(0,1fr) calc(var(--u)*14) calc(var(--u)*62) calc(var(--u)*60) calc(var(--u)*40);gap:calc(var(--u)*6);align-items:center;
  background:var(--panel-2);border:calc(var(--u)*2) solid transparent;color:var(--chalk);font-family:var(--font-body);font-size:calc(var(--u)*13);padding:calc(var(--u)*4) calc(var(--u)*6);cursor:pointer;text-align:left}
div.lc{cursor:default}
.lc.on{border-color:var(--gold);background:var(--ink)}
.lc:hover:not([disabled]):not(div){border-color:var(--line)}
.lc.on:hover{border-color:var(--gold)}
.lc:focus-visible{outline:calc(var(--u)*3) solid var(--gold);outline-offset:calc(var(--u)*1)}
.lc[disabled]{opacity:.4;cursor:not-allowed}
.lc .num{font-family:var(--font-display);font-size:calc(var(--u)*11);color:var(--dim)}
.lc .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .pos{font-family:var(--font-display);font-size:calc(var(--u)*11);color:var(--sea)}
.lc .stars{font-size:calc(var(--u)*11);white-space:nowrap}
.lc .pp{font-size:calc(var(--u)*12);text-align:right;white-space:nowrap}
.en{height:calc(var(--u)*8);background:var(--night);position:relative;display:block}
.en i{position:absolute;left:0;top:0;bottom:0}
.en i.hi{background:var(--sea)}.en i.mid{background:var(--gold)}.en i.lo{background:var(--red)}
input[type=checkbox]{width:calc(var(--u)*18);height:calc(var(--u)*18);accent-color:var(--gold);padding:0;margin:0;flex:none}
@media (prefers-reduced-motion:reduce){.ticker p{animation:none}}
</style>
</head>
<body>

<div id="wrap"><div id="frame">
  <canvas id="cv" width="960" height="540" aria-label="Pacific Huck game field"></canvas>
  <div id="ui"></div>
</div></div>

<script>
(()=>{
'use strict';
// ---------------------------------------------------------------- constants
const W=960,H=540,PPY=12,SQ=8.6,FT=170,ZH=10,P=2,FL=110,FW=40,VIEW=W/PPY;
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),ui=document.getElementById('ui'),frame=document.getElementById('frame'),wrap=document.getElementById('wrap');
ctx.imageSmoothingEnabled=false;
const PAL={night:'#14202e',panel:'#1f3044',panel2:'#2b4560',chalk:'#f3efe2',dim:'#a9b8c6',sunset:'#ff8f3d',sea:'#6fd0c1',gold:'#ffd25a',red:'#ff6b5d',ink:'#0b121a',cone:'#ff7a1a'};
const FONT='Silkscreen, "Courier New", monospace';
const VERSION='Version 25 · Nov 18';

// ---------------------------------------------------------------- helpers
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
const rand=(a,b)=>a+(b-a)*Math.random();
const randi=(a,b)=>Math.floor(a+(b-a+1)*Math.random());
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wpick(arr,wf){const ws=arr.map(wf);let s=ws.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<arr.length;i++){s-=ws[i];if(s<=0)return arr[i]}return arr[arr.length-1]}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function colorClose(a,b){const x=hexRgb(a),y=hexRgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])<120}

// ---------------------------------------------------------------- teams (real West Coast high school programs and their school colors)
const TEAMS=[
 {id:'lks',name:'Lakeside',city:'Seattle',st:'WA',abbr:'LKS',c1:'#7a1f2b',c2:'#f2c14e'},
 {id:'gar',name:'Garfield',city:'Seattle',st:'WA',abbr:'GAR',c1:'#5b2d8e',c2:'#f4f4f4'},
 {id:'roo',name:'Roosevelt',city:'Seattle',st:'WA',abbr:'RHS',c1:'#1f8a3a',c2:'#f2c230'},
 {id:'bal',name:'Ballard',city:'Seattle',st:'WA',abbr:'BAL',c1:'#c8102e',c2:'#111111'},
 {id:'bai',name:'Bainbridge',city:'Bainbridge Island',st:'WA',abbr:'BAI',c1:'#13294b',c2:'#f1b82d'},
 {id:'nws',name:'Northwest School',city:'Seattle',st:'WA',abbr:'NWS',c1:'#7b1e34',c2:'#f2f2f2'},
 {id:'gra',name:'Grant',city:'Portland',st:'OR',abbr:'GRA',c1:'#1f4fa0',c2:'#a3abb3'},

const TIER_BASE=[4.9,7.1,8.5],TIER_BAND=[[1,6.75],[6.8,7.95],[8,10]],TIER_POT=[6.75,7.95,9.6];
const ROSTER_POS=['H','H','H','H','H','C','C','C','C','C','C','D','D','D'];
function genPlayer(r,pos,tier,used,grade){
  const bias={H:{thr:1.8,hnd:.9,spd:-.6,jmp:-.9,def:-.9,sta:-.3},C:{thr:-1.1,spd:1.2,hnd:.8,jmp:.7,def:-1,sta:-.6},D:{thr:-1.3,spd:.8,hnd:-.7,jmp:.7,def:1.8,sta:-1.3}}[pos];
  const p={id:'p'+Math.floor(r()*2e9).toString(36),first:pick(FIRST,r),last:pick(LAST,r),pos,skin:Math.floor(r()*SKIN.length),hair:Math.floor(r()*HAIR.length),style:Math.floor(r()*3),grade:grade||9+Math.floor(r()*4),tier};
  const q=tier===0?r()*1.9-.95:0; // role players range from end-of-bench to solid starter
  for(const a of ATTR)p[a]=clamp(Math.round(TIER_BASE[tier]+q+bias[a]+(r()*2.4-1.2)),1,10);
  let n;do{n=Math.floor(r()*100)}while(used.has(n));used.add(n);p.num=n;
  return p;
}
function shapeTier(p,tier,r){
  const[lo,hi]=TIER_BAND[tier];let guard=0;
  while(ovr(p)>hi&&guard++<80){const c=ATTR.filter(a=>p[a]>1);p[pick(c,r)]--}
  while(ovr(p)<lo&&guard++<160){const c=ATTR.filter(a=>p[a]<10);if(!c.length)break;p[pick(c,r)]++}
}
function setPot(p,r){p.pot=Math.max(ovr(p),Math.min(TIER_POT[p.tier||0],ovr(p)+.3+r()*1.4))}
function genRoster(r,prestige,elite){
  const used=new Set();
  const n5=elite?1:(prestige>=5&&r()<.3)?1:0;
  const n4=elite?3:[0,r()<.5?1:0,1,r()<.5?1:2,2,r()<.5?2:3][prestige];
  const order=shuffle(ROSTER_POS.map((_,i)=>i),r),tiers=ROSTER_POS.map(()=>0);
  order.slice(0,n5).forEach(i=>tiers[i]=2);order.slice(n5,n5+n4).forEach(i=>tiers[i]=1);
  const adj=(prestige-3)*.3+(elite?.4:0);
  const ro=ROSTER_POS.map((ps,i)=>{
    const p=genPlayer(r,ps,tiers[i],used);
    for(const a of ATTR)if(r()<.7)p[a]=clamp(Math.round(p[a]+adj),1,10);
    shapeTier(p,tiers[i],r);setPot(p,r);
    return p;
  });
  // no two teammates share a first or last name
  const fs=new Set(),ls=new Set();
  for(const p of ro){
    for(let k=0;k<30&&fs.has(p.first);k++)p.first=pick(FIRST,r);
    for(let k=0;k<30&&ls.has(p.last);k++)p.last=pick(LAST,r);
    fs.add(p.first);ls.add(p.last);
  }
  return ro;
}

function beep(f,d=.08,type='square',v=.05,slide=0,delay=0){
  const a=audio();if(!a||muted)return;

  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);
}

function mouseAim(huck){
  const h=G.off[G.holder],w=mouseWorld();
  let dx=w.x-h.x,dy=w.y-h.y,d=Math.hypot(dx,dy);
  const maxR=huck?huckRange(h.p.thr):flatRange(h.p.thr),over=d>maxR;

  return{h,tx:h.x+dx,ty:h.y+dy,d,huck,over};
}

function effective(b,en){
  const e=clamp(en??100,0,100)/100,f=.72+.28*e,g=.85+.15*e,h=.9+.1*e;
  return Object.assign({},b,{spd:b.spd*f,jmp:b.jmp*f,def:b.def*f,hnd:b.hnd*g,thr:b.thr*h,base:b});
}
function mkEnt(b,side,idx,meId){

    speed:6+p.spd*.38,slot:0,lane:p.pos==='H'?'H':'C',isMe:!!meId&&p.id===meId};
}

function buildEnts(){
  G.off=G.myLine.map((p,i)=>mkEnt(p,'off',i,G.meId));
  // their best defender takes our best player
  const oppSorted=G.oppLine.slice().sort((a,b)=>ovr(b)-ovr(a));
  const ourOrder=G.myLine.map((p,i)=>i).sort((a,b)=>ovr(G.myLine[b])-ovr(G.myLine[a]));
  G.def=new Array(7);
  ourOrder.forEach((oi,k)=>{G.def[oi]=mkEnt(oppSorted[k],'def',oi)});
}
// The coach's line: O-line favors throwers and cutters, D-line favors defenders, and tired legs sit.
function coachPick(ro,kind){
  const en=p=>(G.en[p.id]??100)/100;
  const offS=p=>p.thr*.4+p.hnd*.3+p.spd*.3,defS=p=>p.def*.5+p.spd*.25+p.jmp*.25;
  const sc=p=>kind==='O'?offS(p)*en(p)**2:kind==='D'?defS(p)*en(p)**2:ovr(p)*en(p)**3;
  const avail=ro.filter(p=>!G.hurt[p.id]);
  // head coach mode: start from your saved line, swapping out anyone hurt or gassed
  if(G.savedLines&&ro===G.me.ro&&(kind==='O'||kind==='D')&&(G.savedLines[kind]||[]).length){
    const byId=new Map(ro.map(p=>[p.id,p]));
    let line=G.savedLines[kind].map(id=>byId.get(id)).filter(p=>p&&!G.hurt[p.id]&&(G.en[p.id]??100)>=35).slice(0,7);
    line=line.concat(avail.filter(p=>!line.includes(p)).sort((a,b)=>sc(b)-sc(a)).slice(0,7-line.length));
    if(line.length<7)line=line.concat(ro.filter(p=>!line.includes(p)).slice(0,7-line.length));
    return line;
  }
  const hs=avail.filter(p=>p.pos==='H').sort((a,b)=>sc(b)-sc(a)).slice(0,kind==='O'?3:2);
  let line=hs.concat(avail.filter(p=>!hs.includes(p)).sort((a,b)=>sc(b)-sc(a)).slice(0,7-hs.length));
  const me=G.meId&&ro.find(p=>p.id===G.meId);
  if(me&&!line.includes(me)&&!G.hurt[me.id]&&(G.en[me.id]??100)>=45){
    const out=line.filter(p=>me.pos==='H'||p.pos!=='H').sort((a,b)=>sc(a)-sc(b))[0];
    if(out)line[line.indexOf(out)]=me;
  }
  if(line.length<7)line=line.concat(ro.filter(p=>!line.includes(p)).slice(0,7-line.length));
  return line;
}
function endPointFatigue(){
  const on=new Set(G.myLine.concat(G.oppLine).map(p=>p.id));
  const mine=new Set(G.me.ro.map(p=>p.id)),cv=(G.cond||1)-1;
  for(const p of G.me.ro.concat(G.opp.ro)){
    const sta=p.sta||5,c=mine.has(p.id)?cv:0;
    if(on.has(p.id))G.en[p.id]=clamp(G.en[p.id]-(10+G.load)*(1.3-sta*.06)*(1-.06*c),0,100);
    else G.en[p.id]=clamp(G.en[p.id]+20+sta*1.2+2*c,0,100);
  }
  for(const id of Object.keys(G.hurt))if(--G.hurt[id]<=0)delete G.hurt[id];
  G.load=0;
}
function maybeInjury(e,chance){
  if(G.demo||!e||Math.random()>chance)return;
  const mine=e.side==='off',ro=mine?G.me.ro:G.opp.ro,line=mine?G.myLine:G.oppLine,hurtP=e.p.base;
  const onIds=new Set(line.map(p=>p.id));
  const bench=ro.filter(p=>!onIds.has(p.id)&&!G.hurt[p.id]);
  if(!bench.length||line.indexOf(hurtP)<0)return;
  const sc=p=>ovr(p)*(G.en[p.id]/100)+(p.pos===hurtP.pos?3:0);
  const sub=bench.sort((a,b)=>sc(b)-sc(a))[0];
  G.hurt[hurtP.id]=2;G.en[hurtP.id]=Math.max(0,G.en[hurtP.id]-25);
  line[line.indexOf(hurtP)]=sub;
  e.p=effective(sub,G.en[sub.id]);e.speed=6+e.p.spd*.38;e.isMe=!!G.meId&&sub.id===G.meId;
  G.pp[sub.id]=(G.pp[sub.id]||0)+1;
  toast(hurtP.id===G.meId?`You're shaken up. ${pname(sub)} subs in for you.`:`Injury sub (${mine?G.me.team.abbr:G.opp.team.abbr}): ${pname(sub)} in for ${pname(hurtP)}`);
}

function later(fn,ms){const t=setTimeout(fn,ms);G.timers.push(t);return t}

function banner(text,sub,col,dur){if(G.demo)return;G.banner={text,sub:sub||'',col:col||PAL.chalk,t:dur||1.2,d:dur||1.2}}
function stallNum(){return G.stallT>0?Math.min(10,Math.floor(G.stallT/.85)+1):0}
const flatRange=t=>34+t*1.1;
// Curve: Q and E lean the next throw left or right (three states, resets after every throw). The disc
// still lands where you aimed; only the path in between bends. The bend is how far the path bows out
// at its middle, and the release leaves at an angle to the side of the straight line.
function bendOf(fx,fy,tx,ty,lean){
  const L=Math.hypot(tx-fx,ty-fy)||1,ux=(tx-fx)/L,uy=(ty-fy)/L,straight=Math.atan2(uy,ux);
  if(!lean)return{k:0,nx:0,ny:0,rel:straight,straight};
  // the thrower's left of the line of flight is (uy,-ux) on this field, since y grows downward
  const nx=lean<0?uy:-uy,ny=lean<0?-ux:ux,k=2*Math.min(L*.3,7); // the path bows out k/2 at its middle
  return{k,nx,ny,rel:Math.atan2(uy*L+2*k*ny,ux*L+2*k*nx),straight};
}
// offset of the bent path from the straight line at fraction s of the flight
const bendAt=(b,s)=>s>0&&s<1?2*s*(1-s)*b.k:0;
// How far off target a throw can land (yards): bad throwers spray it, good ones put it on a dime.
function throwErr(thr,d,type){
  const e=d*(type==='flat'?(.075-thr*.0065):(.12-thr*.009));
  return e*(G&&stallNum()>=8?1.5:1);
}
const huckRange=t=>46+t*2.9;

function computeForce(){
  const y=G.anchor.y;
  G.os=Math.abs(y-20)<6?(Math.random()<.5?1:-1):(y<20?-1:1);
  G.markAng=Math.atan2(-G.os,.35);
}
// Handlers stay back (in Vertical, the dump and swing spots). Everyone else cuts. Roles are set once per
// possession by the style's handler count (styleRoles); whoever holds the disc keeps his role, so when a
// cutter catches it every handler sets up around him. In Vertical the cutters keep their place in line:
// G.stack runs front to back; cuts come from the back, and a cutter who finishes rejoins at the front.
function assignSlots(){
  const h=G.holder;
  for(const e of G.off)e.stay=null;
  if(!G.off.some(e=>e.role))styleRoles(STYLE_HANDLERS[G.style]||2);
  const handlers=G.off.filter(e=>e.idx!==h&&e.role==='H');
  const cutters=G.off.filter(e=>e.idx!==h&&e.role!=='H');
  handlers.forEach((e,i)=>{e.slot=i;e.lane='H'});
  for(const e of cutters)e.lane='C';
  const ids=new Set(cutters.map(e=>e.idx));
  G.stack=(G.stack||[]).filter(i=>ids.has(i));
  for(const e of cutters)if(!G.stack.includes(e.idx))G.stack.push(e.idx);
  G.spots=G.style&&G.style!=='vert'?styleSetup(G.style):null;
}
function stackY(){return clamp(lerp(20,G.anchor.y,.3)-G.os*2,10,30)}
function stackSpot(k,n){
  const front=G.anchor.x+11,back=106;
  let sp=3;if(n>1&&front+(n-1)*sp>back)sp=Math.max(1.6,(back-front)/(n-1));
  return[clamp(front+k*sp,1,107),stackY()];
}
function slotPos(e){
  if(e.stay)return e.stay;
  if(G.spots&&G.spots[e.idx])return G.spots[e.idx]; // Horizontal, 4-1, 1-4: his own spot in the style
  const a=G.anchor,os=G.os;
  if(e.lane==='H'){
    if(e.slot===0)return[clamp(a.x-4.5,.5,108),clamp(a.y-os*5,2,38)];
    return[clamp(a.x+1,.5,108),clamp(a.y-os*12,3,37)];
  }
  const k=G.stack?G.stack.indexOf(e.idx):-1;
  return stackSpot(k<0?(G.stack?G.stack.length:0):k,G.stack?G.stack.length:1);
}
function setupPossession(x,y,label){
  G.flight=null;
  // the game's offense style runs on O-line points; everything else (and the title-screen demo) is Vertical
  G.style=!G.demo&&G.pointKind==='O'&&STYLES.includes(G.styleChoice)?G.styleChoice:'vert';
  const hs=styleRoles(STYLE_HANDLERS[G.style]);
  let h=hs[0]||G.off[0];
  const meEnt=G.off.find(e=>e.isMe);
  if(meEnt&&Math.random()<.35)h=meEnt;
  G.holder=h.idx;G.anchor={x,y};
  h.x=x;h.y=y;h.vx=h.vy=0;h.state='holder';
  G.stack=shuffle(G.off.filter(e=>e!==h&&e.role==='C').map(e=>e.idx));
  G.activeCut=-1;G.cutGap=.9;G.nextDeep=Math.random()<.4;G.double=false;G.swingT=rand(2,3.5);
  styleOrder();
  computeForce();assignSlots();
  const jit=G.style==='vert'?1:.3;
  for(const e of G.off){
    e.hist.length=0;
    if(e===h)continue;
    const[tx,ty]=slotPos(e);e.x=tx+rand(-jit,jit);e.y=ty+rand(-jit,jit);e.vx=e.vy=0;e.state=e.lane==='H'?'handler':'stack';
  }
  for(const d of G.def){
    const o=G.off[d.idx];d.vx=d.vy=0;d.bite=0;
    if(o===h){d.state='mark';d.x=h.x+Math.cos(G.markAng)*1.2;d.y=h.y+Math.sin(G.markAng)*1.2}
    else{d.state='guard';d.x=o.x+1;d.y=o.y}
  }
  G.phase='ready';G.readyT=1.0;G.stallT=0;G.markerSet=false;G.settle=0;G.resetCut=false;G.fake=0;G.lean=0;
  G.disc.x=x;G.disc.y=y;G.disc.z=1.1;
  G.camX=clamp(x-16,-4,FL+4-VIEW);
  if(label)banner(label,'',PAL.sea,1.0);
}

function nextPoint(){
  const kind=G.nextReceiver===0?'O':'D';
  G.oppLine=coachPick(G.opp.ro,kind==='O'?'D':'O');
  if(G.demo||G.autoLines){
    G.myLine=coachPick(G.me.ro,kind);
    toast(`Coach sends out the ${kind}-line`);
    startPoint(kind);
  }else showLineCall(kind);
}
function startPoint(kind){
  ui.innerHTML='';
  G.lastLine=G.myLine.slice();G.load=0;
  for(const p of G.myLine.concat(G.oppLine))G.pp[p.id]=(G.pp[p.id]||0)+1;
  buildEnts();
  G.pointKind=kind;
  if(kind==='O'){let x=rand(12,34);if(x<20)x=20;setupPossession(x,rand(8,32),G.styleChoice&&G.styleChoice!=='vert'?`OFFENSE · ${STYLE_NAME[G.styleChoice].toUpperCase()}`:'OFFENSE')}
  else{G.phase='wait';later(()=>startDefense(rand(80,90),true),200)}
}
function callTimeout(){
  if(!G||G.demo||G.paused||G.phase!=='live'||G.holder<0||ui.firstElementChild)return;
  if(G.timeouts<=0){toast('No timeouts left');return}
  G.timeouts--;G.paused=true;SFX.whistle();
  for(const p of G.myLine)G.en[p.id]=Math.min(100,G.en[p.id]+10);
  for(const e of G.off){const b=e.p.base;e.p=effective(b,G.en[b.id]);e.speed=6+e.p.spd*.38}
  show(`<div class="screen"><div class="panel" style="width:calc(var(--u)*560)">
    <div class="eyebrow">Timeout · ${G.timeouts} left this game</div><h2>Catch your breath</h2>
    <p class="dim">Your line gets 10 energy back. Subs only happen between points or for injuries, so these seven finish the point. The stall count picks up at ${Math.max(1,stallNum())}.</p>
    <div class="lc-list">${G.myLine.map(p=>lineRow(p,true,true)).join('')}</div>
    <div class="row end"><button class="btn" id="tores" data-primary>Back to it <span class="kbd">Enter</span></button></div></div></div>`);
  on('tores',()=>{G.paused=false;ui.innerHTML='';G.settle=.4});
}
function energyBar(id){const e=Math.round(G.en[id]??100),c=e>=70?'hi':e>=40?'mid':'lo';return`<span class="en" title="Energy ${e}"><i class="${c}" style="width:${e}%"></i></span>`}
function lineRow(p,isOn,still){
  const hurt=!!G.hurt[p.id];
  const inner=`<span class="num">#${p.num}</span><span class="nm">${esc(pname(p))}${p.id===G.meId?' <b class="gold">YOU</b>':''}</span><span class="pos">${p.pos}</span><span class="stars">${'★'.repeat(starsOf(p))}</span>${energyBar(p.id)}<span class="dim pp">${hurt?'Hurt':(n=>`${n} pt${n===1?'':'s'}`)(G.pp[p.id]||0)}</span>`;
  return still?`<div class="lc on">${inner}</div>`:`<button class="lc ${isOn?'on':''}" data-id="${p.id}" ${hurt?'disabled':''} aria-pressed="${isOn}">${inner}</button>`;
}
function showLineCall(kind){
  G.phase='wait';
  let sel=new Set(coachPick(G.me.ro,kind).map(p=>p.id)),autoChk=false;
  const ro=G.me.ro.slice().sort((a,b)=>('HCD'.indexOf(a.pos)-'HCD'.indexOf(b.pos))||(ovr(b)-ovr(a)));
  const oppStars=byOvr(G.oppLine).slice(0,2);
  const NAMES={O:'O-line',D:'D-line',F:'Freshest',S:'Same line'};
  const render=focusId=>{
    const chosen=ro.filter(p=>sel.has(p.id)),nh=chosen.filter(p=>p.pos==='H').length;
    const avgE=chosen.length?Math.round(avg(chosen.map(p=>G.en[p.id]))):0;
    show(`<div class="screen"><div class="panel lcpanel">
      <div class="row between"><div><div class="eyebrow">Line call · ${esc(G.me.team.abbr)} ${G.score[0]}–${G.score[1]} ${esc(G.opp.team.abbr)}</div>
        <h2>${kind==='O'?'Offense point':'Defense point'}</h2></div>
        <div class="row">${['O','D','F','S'].map(k=>`<button class="btn alt small" data-preset="${k}" ${k==='S'&&!G.lastLine?'disabled':''}>${NAMES[k]}</button>`).join('')}</div></div>
      <p class="dim">${kind==='O'?'You receive the pull.':`You pull to ${esc(G.opp.team.name)}.`} They're sending out ${oppStars.map(p=>`${esc(pname(p))} ${'★'.repeat(starsOf(p))}`).join(' and ')}. Pick seven. Tired legs run slower and jump lower, and bench time brings them back.</p>
      <div class="lc-grid">${ro.map(p=>lineRow(p,sel.has(p.id))).join('')}</div>
      <div class="row between">
        <label class="row" for="autol" style="gap:calc(var(--u)*8)"><input type="checkbox" id="autol" ${autoChk?'checked':''}> Let the coach call lines for the rest of this game</label>
        <div class="row"><span class="${chosen.length===7?'good':'bad'}">${chosen.length}/7</span><span class="dim">${nh} handler${nh===1?'':'s'} · energy ${avgE}</span>
        <button class="btn" id="lcgo" data-primary ${chosen.length===7?'':'disabled'}>Take the field <span class="kbd">Enter</span></button></div>
      </div></div></div>`);
    document.getElementById('autol').addEventListener('change',e=>{autoChk=e.target.checked});
    ui.querySelectorAll('.lc[data-id]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.id;
      if(sel.has(id))sel.delete(id);else if(sel.size<7)sel.add(id);else{toast('Seven is the max. Take someone off first.');return}
      SFX.click();render(id);
    }));
    ui.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.preset;
      let line=k==='S'?G.lastLine.filter(p=>!G.hurt[p.id]):coachPick(G.me.ro,k);
      if(line.length<7)line=line.concat(coachPick(G.me.ro,kind).filter(p=>!line.includes(p)).slice(0,7-line.length));
      sel=new Set(line.map(p=>p.id));SFX.click();render();
    }));
    on('lcgo',()=>{
      if(sel.size!==7)return;
      if(autoChk){G.autoLines=true;setAutoLines(true)}
      G.myLine=ro.filter(p=>sel.has(p.id));startPoint(kind);
    });
    if(focusId){const nb=ui.querySelector(`.lc[data-id="${focusId}"]`);if(nb)nb.focus({preventScroll:true})}
  };
  render();
}

// ---------------------------------------------------------------- AI movement
// acc: how hard he accelerates (yd/s^2). brake: higher means he runs full speed closer to the spot.
function steer(e,tx,ty,mul,dt,acc=40,brake=5){
  const max=e.speed*mul;let dx=tx-e.x,dy=ty-e.y;const L=Math.hypot(dx,dy);
  let dvx=0,dvy=0;
  if(L>.12){const s=Math.min(max,L*brake);dvx=dx/L*s;dvy=dy/L*s}
  const a=acc*dt;
  e.vx+=clamp(dvx-e.vx,-a,a);e.vy+=clamp(dvy-e.vy,-a,a);
}
function integrate(e,dt){
  e.x=clamp(e.x+e.vx*dt,-3,FL+3);e.y=clamp(e.y+e.vy*dt,-2.5,FW+2.5);
  e.anim+=Math.hypot(e.vx,e.vy)*dt;
  if(Math.abs(e.vx)>.5)e.face=e.vx>0?1:-1;
}
// Bodies: two players can't occupy the same spot, so a receiver can't run through the defender
// standing in front of him. He has to go around.
function separate(a,b,min=.75){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d>=min||d<1e-4)return;
  const push=(min-d)/2,ux=dx/d,uy=dy/d;
  a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;
}
function histAt(o,t){
  const h=o.hist;if(!h.length)return{x:o.x,y:o.y};
  for(let i=h.length-1;i>=0;i--)if(h[i][0]<=t)return{x:h[i][1],y:h[i][2]};
  return{x:h[0][1],y:h[0][2]};
}
function guardSteer(d,o,dt){
  const lag=clamp(.2+(5.5-d.p.def)*.018+d.bite,.08,.75);
  const hp=histAt(o,G.t-lag),a=G.anchor;
  // person D: stay between your man and the disc
  let nx=a.x-hp.x,ny=a.y-hp.y;const nl=Math.hypot(nx,ny)||1;
  steer(d,hp.x+nx/nl*.8,hp.y+ny/nl*.8,1,dt,48,6);
  if(Math.abs(d.vx)<.5)d.face=o.x>d.x?1:-1;
}
function markSteer(d,dt){
  const h=G.holder>=0?G.off[G.holder]:null;
  if(!h){guardSteer(d,G.off[d.idx],dt);return}
  const ang=G.fake>0?Math.atan2(G.os*.9,.5):G.markAng;
  const mx=h.x+Math.cos(ang)*1.2,my=h.y+Math.sin(ang)*1.2;
  steer(d,mx,my,1.15,dt,55,7);
  if(dist(d.x,d.y,mx,my)<1.8)G.markerSet=true;
  d.face=h.x>d.x?1:-1;
}
function updateOff(e,dt,ph){
  if(e.idx===G.holder){const k=Math.exp(-10*dt);e.vx*=k;e.vy*=k;return}
  if(ph==='ready'){const[tx,ty]=slotPos(e);hold(e,tx,ty,dt);return}
  switch(e.state){
    // the disc is coming to him: sprint at it, re-aiming every frame at where he can meet it
    case'chase':{if(G.flight){const[mx,my]=meetPoint(e,G.flight);e.tx=mx;e.ty=my}steer(e,e.tx,e.ty,1.12,dt,60,25);break}
    case'cut':steer(e,e.tx,e.ty,1.05,dt,60,8);e.timer-=dt;
      if(e.timer<=0||dist(e.x,e.y,e.tx,e.ty)<.8){e.state='clear';e.timer=1.4}break;
    case'clear':{const[tx,ty]=slotPos(e);steer(e,tx,ty,.9,dt,50,6);e.timer-=dt;
      if(e.timer<=0||dist(e.x,e.y,tx,ty)<1)e.state=e.lane==='H'?'handler':'stack';break}
    // stack cutter, in order: a hard jab to sell the other way, explode into the cut, look for it, then get out
    case'jab':steer(e,e.jx,e.jy,1,dt,70,12);e.timer-=dt;
      if(e.timer<=0||dist(e.x,e.y,e.jx,e.jy)<.45){e.state='scut';e.cutT=0;e.timer=Math.max(e.deep?2.2:1.5,dist(e.x,e.y,e.tx,e.ty)/e.speed+.5);const d=G.def[e.idx];d.bite=Math.max(d.bite,e.pendBite)}break;
    case'scut':steer(e,e.tx,e.ty,1.05,dt,65,8);e.timer-=dt;e.cutT=(e.cutT||0)+dt;
      if(e.timer<=0||dist(e.x,e.y,e.tx,e.ty)<.8){e.state='linger';e.timer=e.deep?.2:.35}break;
    case'linger':steer(e,e.tx,e.ty,.3,dt,50,5);e.timer-=dt;if(e.timer<=0)clearOut(e);break;
    case'sclear':e.timer-=dt;
      if(e.wp){steer(e,e.wp[0],e.wp[1],.95,dt,60,8);if(dist(e.x,e.y,e.wp[0],e.wp[1])<1.2)e.wp=null}
      else{const[tx,ty]=slotPos(e);steer(e,tx,ty,.8,dt,50,6);if(dist(e.x,e.y,tx,ty)<.8||e.timer<-2.5)e.state=e.lane==='H'?'handler':'stack'}
      break;
    default:{const[tx,ty]=slotPos(e);hold(e,tx,ty,dt)}
  }
}
function hold(e,tx,ty,dt){
  const L=dist(e.x,e.y,tx,ty);
  if(L>2.5)steer(e,tx,ty,.9,dt,50,6);
  else if(L>.5)steer(e,tx,ty,.6,dt,50,6);
  else{const k=Math.exp(-14*dt);e.vx*=k;e.vy*=k}
  if(Math.hypot(e.vx,e.vy)<1)e.face=G.anchor.x>e.x?1:-1;
}
function updateDef(d,dt,ph){
  const o=G.off[d.idx];
  if(d.state==='mark')markSteer(d,dt);
  else if(ph==='ready')steer(d,o.x+1,o.y,.6,dt);
  else if(d.state==='chase'){d.chaseDelay-=dt;
    // race to the spot just ahead of where his man meets the disc: in front, he takes it; beaten, the man's body is in the way
    if(o.state==='chase'&&!d.help){const f=G.flight;d.tx=o.tx-(f?f.ux:0);d.ty=o.ty-(f?f.uy:0)}if(d.chaseDelay<=0)steer(d,d.tx,d.ty,1.08,dt,55,9);else guardSteer(d,o,dt)}
  else guardSteer(d,o,dt);
  if(d.bite>0)d.bite=Math.max(0,d.bite-dt*.35);
}
// Stack discipline, every style: there is always a cut on. The next cutter starts his jab as the one
// ahead finishes his cut (now and then two go close together), and if nobody is cutting, someone goes
// right away. Never more than two cutters in the lane. styleCuts picks who goes, under or deep, and where.
function inLane(e){return e.state==='jab'||e.state==='scut'||e.state==='linger'}
function cutting(e){return e.state==='jab'||e.state==='scut'}
// an under cutter has made his cut when he's nearly there; a deep cutter once he's a second into his sprint
function madeCut(e){
  if(e.state==='jab')return false;
  if(e.state!=='scut')return true;
  return e.deep?e.cutT>=1:(e.cutT>=1.1||dist(e.x,e.y,e.tx,e.ty)<2.5);
}
// back at his spot, or out of the lane and nearly home: ready to go again
function canCut(e){
  if(e.state==='stack')return true;
  if(e.state!=='sclear'||e.wp||e.timer>.8)return false;
  const[x,y]=slotPos(e);return dist(e.x,e.y,x,y)<5;
}
function stackLogic(dt){
  if(G.style==='horiz')swingLogic(dt);
  const lane=G.off.filter(e=>e.lane==='C'&&inLane(e));
  if(lane.length>=2)return;
  if(lane.some(cutting)){
    const act=G.activeCut>=0?G.off[G.activeCut]:null;
    if(act&&act.idx!==G.holder&&!madeCut(act)&&!G.double)return; // he hasn't made his cut yet
    G.cutGap-=dt;if(G.cutGap>0)return;
  }
  styleCuts(dt);
}
// Make it a real cut: long enough to reach full speed and pull away from his defender. Under cuts come
// back toward the disc at least 10 yards; deep cuts go at least 16 and always upfield of where he starts.
const CUT_MIN={under:10,deep:16};
function shapeCut(e,type,sd,tx,ty){
  const a=G.anchor,lo=a.x+2;
  if(type==='deep')tx=Math.max(tx,Math.min(107.5,e.x+14));
  else tx=clamp(Math.min(tx,e.x-3),lo,100);
  let dx=tx-e.x,dy=ty-e.y,L=Math.hypot(dx,dy);
  if(L<CUT_MIN[type]){
    const k=CUT_MIN[type]/Math.max(L,.5);
    tx=e.x+dx*k;ty=e.y+dy*k;
    tx=type==='deep'?Math.min(tx,107.5):clamp(tx,lo,100);ty=clamp(ty,2,38);
    // still short (pinned on a sideline or near the end zone): keep going toward the side, then along the field
    for(let i=0;i<12&&Math.hypot(tx-e.x,ty-e.y)<CUT_MIN[type];i++){
      const ny=clamp(ty+sd*1.5,2,38);
      if(Math.abs(ny-ty)>.01&&Math.abs(ny-e.y)>Math.abs(ty-e.y))ty=ny;
      else if(type==='deep')tx=Math.min(107.5,tx+2);
      else tx=Math.max(lo,tx-1.5);
    }
  }
  return[tx,ty];
}
// sell it the other way first: a hard step of about two and a half yards away from where he's going
function setJab(e,len){
  const dx=e.tx-e.x,dy=e.ty-e.y,L=Math.hypot(dx,dy)||1;
  e.jx=clamp(e.x-dx/L*len,.5,108);e.jy=clamp(e.y-dy/L*len,1,39);
}
// Vertical: the back of the stack cuts, alternating under and deep. side: 'live' (the open
// side, G.os) or 'dead'.
function startStackCut(e,deep,side){
  const a=G.anchor,os=G.os,sd=side==='dead'?-os:os,y0=stackY();
  e.deep=deep;e.state='jab';e.timer=.45;
  if(deep){e.tx=clamp(a.x+rand(25,38),a.x+15,107.5);e.ty=clamp(y0+sd*rand(4,11),2.5,37.5)}
  else{e.tx=clamp(a.x+rand(7,12),.5,100);e.ty=clamp(y0+sd*rand(8,13),1.5,38.5)}
  [e.tx,e.ty]=shapeCut(e,deep?'deep':'under',sd,e.tx,e.ty);
  setJab(e,2.5);
  // does the defender buy the jab? Quick cutters against weak defenders get bigger bites.
  const d=G.def[e.idx];

// ---------------------------------------------------------------- offense styles
// Four ways to line up on offense. Vertical is the classic stack and the default. Horizontal, 4-1 and 1-4
// give every player his own spot, worked out from the disc each time it moves: "disc side" is the open
// side (G.os) and "far side" the other, so a 4-1 is a 4-1 whichever side the disc is on. Cuts are always
// automatic: about 75% go to the live side, and the order and gaps change every point.
const STYLES=['vert','horiz','41','14'];
const STYLE_NAME={vert:'Vertical',horiz:'Horizontal','41':'4-1','14':'1-4'};
const STYLE_HANDLERS={vert:2,horiz:3,'41':2,'14':2};
const STYLE_NOTE={vert:'2 handlers and a 5-man stack. Cuts come from the back, then rejoin at the front.',
  horiz:'3 handlers across the back, 4 cutters across the field. The handlers swing it side to side.',
  '41':'4 cutters on the disc side go in turn. The 1 on the far side is the deep threat.',
  '14':'The 1 on the disc side works under. The 4 on the far side go deep.'};
const STYLE_KEY='pacific-huck-style',LIVE_SHARE=.75,SKIP_TURN=.15;
// coach games keep the style in the program save; quick games keep their own
function getStyle(kind){
  if(kind==='coach'&&CAR)return STYLES.includes(CAR.style)?CAR.style:'vert';
  try{const v=localStorage.getItem(STYLE_KEY);return STYLES.includes(v)?v:'vert'}catch(e){return'vert'}
}
function setStyle(kind,v){
  if(kind==='coach'&&CAR){CAR.style=v;saveProgram()}
  else try{localStorage.setItem(STYLE_KEY,v)}catch(e){}
}
// who handles: handler-position players (best throwers first), topped up with the best throwers on the line
function styleRoles(nH){
  const byThr=a=>a.slice().sort((x,y)=>y.p.thr-x.p.thr);
  let hs=byThr(G.off.filter(e=>e.p.pos==='H')).slice(0,nH);
  if(hs.length<nH)hs=hs.concat(byThr(G.off.filter(e=>!hs.includes(e))).slice(0,nH-hs.length));
  for(const e of G.off)e.role=hs.includes(e)?'H':'C';
  return hs;
}
// each cutter's slot in the formation and the order the cuts go in, new every possession
function styleOrder(){
  const st=G.style,cs=G.off.filter(e=>e.role==='C');
  for(const e of G.off)e.cslot=-1;
  G.cutOrder=[];G.cutPtr=0;
  if(st==='vert')return;
  let lone=null;
  if(st==='41')lone=cs.slice().sort((a,b)=>b.p.spd-a.p.spd)[0];                     // fastest man goes deep alone
  if(st==='14')lone=cs.slice().sort((a,b)=>(b.p.spd+b.p.hnd)-(a.p.spd+a.p.hnd))[0];  // best all-round cutter works under alone
  const rest=shuffle(cs.filter(e=>e!==lone));
  if(st==='horiz'){
    rest.forEach((e,i)=>e.cslot=i); // 0 to 3, sideline to sideline
    G.cutOrder=[{pick:'mid',type:'under'},{pick:'edge',type:'deep'}];G.cutPtr=randi(0,1);
  }else if(st==='41'){
    rest.forEach((e,i)=>e.cslot=i);lone.cslot=4; // 0 is the front of the group
    const g=i=>({c:i,type:Math.random()<.6?'under':'deep'});
    G.cutOrder=[g(0),g(1),{c:4,type:'deep'},g(2),g(3),{c:4,type:'deep'}];
  }else{
    lone.cslot=0;rest.forEach((e,i)=>e.cslot=i+1);
    G.cutOrder=[{c:0,type:'under'},{c:1,type:'deep'},{c:2,type:'deep'},{c:0,type:'under'},{c:3,type:'deep'},{c:4,type:'deep'}];
  }
}
// where everyone stands right now (not used by Vertical, which keeps its moving stack): {idx:[x,y]}
function styleSetup(st){
  const a=G.anchor,os=G.os,S={},cl=(x,y)=>[clamp(x,.5,107.5),clamp(y,1.5,38.5)];
  const hs=G.off.filter(e=>e.idx!==G.holder&&e.lane==='H'),cs=G.off.filter(e=>e.idx!==G.holder&&e.lane==='C');
  if(st==='horiz'){
    // handlers spread across the width behind the disc, about 11 yards apart (one on each side when
    // there's room); if a cutter has the disc, the third handler sets up right behind him
    const spots=[];
    for(const o of [11,-11,22,-22]){const y=a.y+o;if(y>=3&&y<=37&&spots.length<2)spots.push(cl(a.x-3,y))}
    if(hs.length>2)spots.push(cl(a.x-5,a.y));
    const byY=hs.slice().sort((p,q)=>p.y-q.y),sp=spots.slice(0,byY.length).sort((p,q)=>p[1]-q[1]);
    byY.forEach((e,i)=>S[e.idx]=sp[i]);
  }else for(const e of hs)S[e.idx]=e.slot===0?cl(a.x-4.5,a.y-os*5):cl(a.x+1,a.y-os*12); // Vertical's dump and swing
  const front=a.x+11,col=(k,n)=>{let sp=3;if(n>1&&front+(n-1)*sp>106)sp=Math.max(1.6,(106-front)/(n-1));return front+k*sp};
  for(const e of cs){
    const k=e.cslot;
    if(st==='horiz')S[e.idx]=cl(front,[5,15,25,35][k]??20);           // side by side across the field
    else if(st==='41')S[e.idx]=k<4?cl(col(k,4),20+os*9):cl(a.x+16,20-os*12);  // 4 on the disc side, 1 far
    else S[e.idx]=k===0?cl(a.x+12,20+os*10):cl(col(k-1,4),20-os*10);  // 1 on the disc side, 4 far
  }
  // nobody closer than 2 yards to anyone (the holder stays put), cutters 10+ yards upfield, all on the field
  const P=Object.keys(S).map(k=>({e:G.off[k],s:S[k]})),minX=Math.min(a.x+10,105);
  const all=P.concat([{e:null,s:[a.x,a.y],fixed:true}]);
  for(let it=0;it<16;it++)for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const A=all[i],B=all[j],dx=B.s[0]-A.s[0],dy=B.s[1]-A.s[1],d=Math.hypot(dx,dy);
    if(d>=2.05)continue;
    const ux=d?dx/d:0,uy=d?dy/d:1,push=(2.05-d)/(A.fixed||B.fixed?1:2);
    if(!A.fixed){A.s[0]-=ux*push;A.s[1]-=uy*push}
    if(!B.fixed){B.s[0]+=ux*push;B.s[1]+=uy*push}
    for(const Q of [A,B])if(!Q.fixed){const c=cl(Q.s[0],Q.s[1]);if(Q.e.lane==='C')c[0]=Math.max(c[0],minX);Q.s[0]=c[0];Q.s[1]=c[1]}
  }

}
// pick the next cutter, the kind of cut and the side for this style
function styleCuts(dt){
  const st=G.style||'vert';
  const ready=G.stack.map(i=>G.off[i]).filter(e=>e&&e.idx!==G.holder&&canCut(e));
  if(!ready.length)return;
  const side=Math.random()<LIVE_SHARE?'live':'dead';
  let e=null,type='under',slot=null;
  if(st==='vert'){
    // cuts start from the back of the stack, farthest from the handlers, where there's the most room to
    // build up speed; he alternates under and deep. Now and then he passes and the next man up goes.
    let i=ready.length-1;
    if(ready.length>1&&Math.random()<SKIP_TURN)i--;
    const deep=G.nextDeep;G.nextDeep=!deep;
    e=ready[i];type=deep?'deep':'under';slot=`${G.stack.indexOf(e.idx)+1}/${G.stack.length}`;
    // he leaves the line as he goes and takes the front place; the stack fills in behind him
    G.stack.splice(G.stack.indexOf(e.idx),1);G.stack.unshift(e.idx);
    startStackCut(e,deep,side);
  }else{
    if(Math.random()<SKIP_TURN)G.cutPtr++; // the next man passes on his turn
    const ord=G.cutOrder;
    for(let n=0;n<ord.length&&!e;n++){
      const o=ord[(G.cutPtr+n)%ord.length];
      e=styleWho(o,side,ready);
      if(e){type=o.type;G.cutPtr+=n+1}
    }
    if(!e)return; // whoever's up is still getting back to his spot
    startStyleCut(e,type,side);
  }
  G.activeCut=e.idx;
  // vary the rhythm: usually a short gap, sometimes a longer beat, sometimes two go close together
  const r=Math.random();
  G.double=r<.12;
  G.cutGap=G.double?rand(.3,.55):r<.27?rand(.4,.8):rand(.05,.3);
  if(G.cutLog)G.cutLog.push({t:G.t,idx:e.idx,slot:st==='vert'?slot:e.cslot,type,side});
}
// Horizontal picks by kind: an edge cutter goes deep down his sideline, a middle cutter comes under.
// The one on the side the cut goes to takes it; if he isn't back yet, the other one crosses over.
function styleWho(o,side,ready){
  if(o.c!=null)return ready.find(e=>e.cslot===o.c)||null;
  const kind=o.pick==='edge'?[0,3]:[1,2],sd=side==='live'?G.os:-G.os;
  return ready.filter(e=>kind.includes(e.cslot)).sort((p,q)=>sd*(slotPos(q)[1]-20)-sd*(slotPos(p)[1]-20))[0]||null;
}
function startStyleCut(e,type,side){
  const a=G.anchor,sd=side==='live'?G.os:-G.os,home=slotPos(e);
  let tx,ty;
  if(type==='under'){tx=a.x+(G.style==='horiz'?rand(4,8):rand(6,11));ty=lerp(20,a.y,.45)+sd*rand(6,11)}
  else{
    tx=clamp(a.x+rand(25,36),a.x+15,107.5);
    const edge=G.style==='horiz'&&Math.sign(home[1]-20)===sd;
    ty=20+sd*(edge?rand(11,16):rand(5,12));
  }
  [tx,ty]=shapeCut(e,type,sd,clamp(tx,.5,type==='under'?100:107.5),clamp(ty,2,38));
  e.tx=tx;e.ty=ty;e.deep=type==='deep';
  e.state='jab';e.timer=.45;
  setJab(e,2.5);
  const d=G.def[e.idx];
  e.pendBite=Math.random()<clamp(.32+(e.p.spd-d.p.def)*.06,.08,.65)?rand(.28,.45):rand(0,.06);
}
// Horizontal: every few seconds the handler farthest from the live side swings across to it
function swingLogic(dt){
  G.swingT-=dt;if(G.swingT>0)return;
  const a=G.anchor,os=G.os;
  const hs=G.off.filter(e=>e.lane==='H'&&e.idx!==G.holder&&e.state==='handler').sort((p,q)=>os*(p.y-q.y));
  if(!hs.length||stallNum()>=6){G.swingT=.6;return}
  const e=hs[0];
  let side='live',ty=clamp(a.y+os*rand(6,10),1.5,38.5);
  if(Math.abs(ty-a.y)<4){side='dead';ty=clamp(a.y-os*rand(7,11),1.5,38.5)} // no room at the sideline
  e.tx=clamp(a.x-rand(1,3),.5,107);e.ty=ty;e.deep=false;e.state='jab';e.timer=.25;
  setJab(e,1.5);
  e.pendBite=rand(0,.15);

// a tiny field per style: downfield runs left to right, the disc side is at the bottom

// the four style buttons. mode: 'ro' just shows the current one (coach pre-game), 'compact' drops the

function showStylePicker(el,kind,mode){

// Get out of the lane in one move, on the break side. In Vertical he took the front place in line when he
// started his cut (so the next man is already at the back): an under cutter peels off to the front, a
// deep cutter turns and comes back up the break side.
function clearOut(e){
  e.state='sclear';e.timer=1.6;
  if(G.spots||e.lane==='H'){e.wp=null;return} // other styles (and handlers): straight back to his own spot
  const front=stackSpot(0,Math.max(1,G.stack.length))[0];
  e.wp=[clamp(e.deep?e.x-3:Math.max(front-1,e.x+2),1,107),clamp(stackY()-G.os*6,2,38)];
}
// Receivers attack the disc: run to the earliest spot on its path they can reach in time,
// instead of waiting at the landing point for their defender to catch up.
// How high a throw rises above its straight line (yards). Hucks float. Flat throws stay level when they're
// short but get a little arc the longer they go, like real ones: a 35-yard flat is over everybody's reach in
// the middle, so only someone near the thrower or where it comes down can get a hand on it.
function arcOf(type,L){return type==='huck'?2.5+L*.11:Math.max(0,(L-12)*.085)}
function discAt(f,t){
  const s=t/f.T;
  if(s<=1)return{x:lerp(f.fx,f.tx,s),y:lerp(f.fy,f.ty,s),z:(f.type==='huck'?lerp(1.5,1,s):lerp(1.4,1,s))+4*f.apex*s*(1-s),late:false};
  const ex=t-f.T,sp=Math.min(f.dist/f.T*.55,10);
  return{x:f.tx+f.ux*sp*ex,y:f.ty+f.uy*sp*ex,z:1-ex*(f.type==='huck'?3.2:2.6),late:true};

function meetPoint(e,f){
  const reach=1.9+e.p.jmp*.09,v=e.speed*1.12,end=f.T+(f.type==='huck'?.28:.36);
  // attack the back end of the flight, not come all the way back into the stack
  for(let t=Math.max(f.t+.04,f.T*.6);t<=end;t+=.04){
    const d=discAt(f,t);
    if(d.z>reach||d.z<=0)continue;
    if(dist(e.x,e.y,d.x,d.y)/v+.06<=t-f.t)return[d.x,d.y];
  }
  return[f.tx,f.ty];
}
// Who has position on the disc? On a flat throw, whoever is between the disc and the other player
// gets it: a receiver in front of his defender catches it, a defender in front of the receiver
// takes it. On a huck it's whoever is under it. Hands (receiver) and defense (defender) give the
// player out of position a chance, and there is a little luck either way.
// D chance for one defender standing at (qx,qy) when the disc reaches (px,py) moving along (ux,uy).
function posD(rp,dp,qx,qy,px,py,ux,uy,rAlong,rcvDist,huck,late){

  const reach=.9+dp.def*.05+dp.jmp*.03+(late?.4:0);
  const w=clamp((reach+.4-dd)/.8,0,1);
  if(w<=0)return 0;
  let adv; // positive: the receiver has position (he's between the disc and the defender)
  if(huck)adv=(dd-rcvDist)*1.2;
  else adv=(dx*ux+dy*uy-rAlong)*1.3+(dd-rcvDist)*.4;

function contest(rcv,px,py,ux,uy,rcvDist,huck,late,skip){
  const rAlong=(rcv.x-px)*ux+(rcv.y-py)*uy;
  let best=null,bestP=0;
  for(const d of G.def){
    if(skip&&skip(d))continue;
    const pD=posD(rcv.p,d.p,d.x,d.y,px,py,ux,uy,rAlong,rcvDist,huck,late);
    if(pD>bestP){bestP=pD;best=d}
  }

// What the ring under a receiver shows: the D chance if you threw it to him right now.
// It predicts the race: you lead him, the disc flies, his defender reacts and runs at the same

// Where to put the disc so it arrives where he'll be: lead him by the flight time.

  const d={x:od.x,y:od.y,vx:od.vx,vy:od.vy,speed:od.speed,p:od.p};

      for(const q of others)if(!(q.mark&&f.t<.4))p=Math.max(p,posD(r.p,q.p,q.x,q.y,c.x,c.y,f.ux,f.uy,rAlong,rd,huck,c.late));

// Who goes for it: the teammate who will be closest to the spot when the disc gets there,
// judged by where everyone is running, not where they are standing.
// What the badge shows: the D chance from the simulation, calibrated against thousands of simulated
// throws (the best looks complete about 83%, a blanketed receiver still sneaks one through about a quarter of the time).
const catchPct=o=>Math.round(25+58*Math.pow(1-o,10));
const openColor=o=>{const c=catchPct(o);return c>=70?PAL.sea:c>=45?PAL.gold:PAL.red};
function openCached(e){
  if(e._oT==null||G.t-e._oT>.06||G.t<e._oT||e._oH!==G.holder){e._o=openness(e);e._oT=G.t;e._oH=G.holder}
  return e._o;
}
function chooseReceiver(tx,ty,ex=G.holder,T){
  if(T==null){const h=G.holder>=0?G.off[G.holder]:null;const L=h?dist(h.x,h.y,tx,ty):15;T=L/22+(L>30?.35:0)}
  let best=null,bt=1e9;
  for(const e of G.off){
    if(e.idx===ex)continue;
    const k=Math.min(T,1.6),px=e.x+e.vx*k,py=e.y+e.vy*k;
    const t=dist(px,py,tx,ty)/e.speed+dist(e.x,e.y,tx,ty)/e.speed*.15;
    if(t<bt){bt=t;best=e}
  }
  return best;
}

// ---------------------------------------------------------------- throwing
function pivotFake(){
  if(!G||G.phase!=='live'||G.fakeCd>0)return;
  G.fake=.65;G.fakeCd=1.4;beep(240,.05,'square',.03);
}
function throwDisc(type,ax,ay,ai){
  if(!G||G.phase!=='live'||G.settle>0||G.holder<0)return false;
  if(G.demo&&!ai)return false;
  const h=G.off[G.holder],thr=h.p.thr;
  let dx=ax-h.x,dy=ay-h.y,d=Math.hypot(dx,dy);
  if(d<2.5)return false;
  const maxR=type==='flat'?flatRange(thr):huckRange(thr);
  if(d>maxR){dx*=maxR/d;dy*=maxR/d;d=maxR}
  let tx=h.x+dx,ty=h.y+dy;
  const lean=G.lean||0;G.lean=0; // a curve only lasts one throw
  // a curved throw costs a little accuracy and a little time
  let err=throwErr(thr,d,type)*(lean?1.2:1);
  const ea=Math.random()*Math.PI*2,er=err*Math.sqrt(Math.random())*1.2;
  tx+=Math.cos(ea)*er;ty+=Math.sin(ea)*er;
  const sp=type==='flat'?19+thr*.9:14+thr*.55;
  const T=(d/sp+(type==='huck'?.35:0))*(lean?1.12:1);
  if(type==='huck'){tx+=G.wind.x*T*.3;ty+=G.wind.y*T*.3}
  const bend=bendOf(h.x,h.y,tx,ty,lean);
  const ang=bend.rel; // what the marker sees is where the disc leaves the hand
  const thrower=G.holder;
  type==='huck'?SFX.huck():SFX.throw();
  h.face=tx>=h.x?1:-1;
  const relIn=Math.abs(angDiff(bend.rel,G.markAng))<.8,straightIn=Math.abs(angDiff(bend.straight,G.markAng))<.8;
  // straight through the wedge: full hand-block chance. Bent around it: much lower. Released into it: full.
  if((relIn||straightIn)&&G.markerSet&&d>3){
    const pb=clamp(.5-thr*.035,.1,.5)*(G.fake>0?.2:1)*(type==='huck'?1.2:1)*(relIn?1:.25);
    if(Math.random()<pb){
      G.holder=-1;G.disc.x=h.x+Math.cos(ang)*1.5;G.disc.y=h.y+Math.sin(ang)*1.5;G.disc.z=0;
      turnover({label:'HANDBLOCK',x:G.disc.x,y:G.disc.y,by:G.def[thrower],kind:'block',thrower:h});
      return true;
    }
  }
  const L=Math.hypot(tx-h.x,ty-h.y)||1;
  G.flight={type,fx:h.x,fy:h.y,tx,ty,t:0,T,dist:L,ux:(tx-h.x)/L,uy:(ty-h.y)/L,apex:arcOf(type,L),touched:new Set(),thrower,bend};
  G.holder=-1;G.phase='flight';
  h.state='clear';h.timer=1;h.stay=[h.x,h.y]; // he follows through where he is until someone catches it
  const rcv=chooseReceiver(tx,ty,thrower,T);
  G.flight.rcv=rcv?rcv.idx:-1;
  if(rcv){
    const[mx,my]=meetPoint(rcv,G.flight);
    rcv.state='chase';rcv.tx=clamp(mx,-1,FL+1);rcv.ty=clamp(my,-1,FW+1);
    const dd=G.def[rcv.idx];dd.state='chase';dd.tx=mx;dd.ty=my;dd.chaseDelay=clamp(.24-dd.p.def*.014,.08,.22);
  }
  if(type==='huck'){
    let help=null,hd=20;
    for(const dd of G.def){if(dd.state==='chase'||dd.idx===thrower)continue;const q=dist(dd.x,dd.y,tx,ty);if(q<hd){hd=q;help=dd}}
    if(help){help.state='chase';help.help=true;help.tx=tx;help.ty=ty;help.chaseDelay=.5}
  }
  G.def[thrower].state='guard';
  return true;
}
function updateFlight(dt){
  const f=G.flight;f.t+=dt;
  const{x,y,z,late}=discAt(f,f.t);
  G.disc.x=x;G.disc.y=y;G.disc.z=Math.max(0,z);
  const bo=f.bend?bendAt(f.bend,f.t/f.T):0;G.disc.ox=f.bend?f.bend.nx*bo:0;G.disc.oy=f.bend?f.bend.ny*bo:0;
  if(z<=0){
    const out=x<0||x>FL||y<0||y>FW;
    turnover({label:out?'OUT':'TURF',x,y,kind:out?'out':'turf',f});return;
  }
  if(f.t<.07)return;
  const contacts=[];
  for(const e of G.off){
    if(e.idx===f.thrower||f.touched.has(e))continue;
    // teammates don't step in front of a throw meant for someone else
    if(f.rcv>=0&&e.idx!==f.rcv&&f.t<f.T*.85)continue;
    if(z>1.9+e.p.jmp*.09)continue;
    const r=1.15+e.p.hnd*.03+(late?.65:0),dd=dist(e.x,e.y,x,y);
    if(dd<r)contacts.push({e,dd});
  }
  for(const e of G.def){
    if(f.touched.has(e))continue;
    if(e.idx===f.thrower&&f.t<.3)continue;
    if(z>1.95+e.p.jmp*.09)continue;
    const own=e.idx===f.rcv,r=(own?.68+e.p.def*.035:.5+e.p.def*.03)+(late?.4:0),dd=dist(e.x,e.y,x,y);
    if(dd<r)contacts.push({e,dd});
  }
  if(!contacts.length)return;
  contacts.sort((a,b)=>a.dd-b.dd);
  const offC=contacts.find(c=>c.e.side==='off'),defC=contacts.find(c=>c.e.side==='def');
  const thrP=G.off[f.thrower].p;
  if(offC&&defC&&f.type==='huck'){
    // both under it: a sky battle, won by whoever is better positioned underneath and jumps higher
    const pD=contest(offC.e,x,y,f.ux,f.uy,offC.dd,true,late,d=>d!==defC.e).pD;
    if(Math.random()>=pD)doCatch(offC.e,f,'SKYED!');
    else turnover({label:'SKYED!',x,y,by:defC.e,kind:'d',f});
    maybeInjury(Math.random()<.5?offC.e:defC.e,.04);
    return;
  }
  const c=contacts[0];f.touched.add(c.e);
  if(c.e.side==='def'){
    // he got to it first, so he's in front of the throw: usually a D
    const own=c.e.idx===f.rcv;
    const pD=own?clamp(.72+(c.e.p.def-thrP.thr)*.03+(late?-.1:0),.45,.9):clamp(.4+(c.e.p.def-thrP.thr)*.03,.2,.6);
    if(Math.random()<pD){turnover({label:late?'LAYOUT D':'D!',x,y,by:c.e,kind:'d',f});if(late)maybeInjury(c.e,.05)}
  }else{
    const huck=f.type==='huck';
    const{pD,by}=contest(c.e,x,y,f.ux,f.uy,c.dd,huck,late,d=>f.touched.has(d)||(d.idx===f.thrower&&f.t<.4));
    if(by&&Math.random()<pD){turnover({label:huck?'SKYED!':late?'LAYOUT D':'D!',x,y,by,kind:'d',f});if(late)maybeInjury(by,.05);return}
    // he won the position battle; now he just has to hang on
    let pc=.95+c.e.p.hnd*.005-(late?.15:0)-(pD>.3?.05:0)-(huck?.03:0);
    pc=clamp(pc,.35,.985);
    if(Math.random()<pc){doCatch(c.e,f,late?'LAYOUT!':null);if(late)maybeInjury(c.e,.05)}
    else turnover({label:'DROP',x,y,kind:'drop',recv:c.e,f});
  }
}
function resetChases(){
  for(const o of G.off)if(o.state==='chase'){o.state='clear';o.timer=1.2}
  for(const d of G.def)if(d.state==='chase'){d.state='guard';d.help=false}
}
// Easter egg: Kangmin Kim of South Eugene never hangs on to it in the end zone. Anywhere else he's normal.
function endZoneHands(p,team){return!(team&&team.id==='seh'&&(p.first+p.last).toLowerCase().replace(/[^a-z]/g,'')==='kangminkim')}
function doCatch(e,f,label){
  const thrEnt=G.off[f.thrower];
  G.flight=null;resetChases();
  if(e.y<0||e.y>FW||e.x>FL||e.x<0){turnover({label:'OUT',x:clamp(e.x,0,FL),y:clamp(e.y,0,FW),kind:'out',f,recv:e});return}
  if(e.x>=90&&!endZoneHands(e.p,G.me.team)){turnover({label:'DROP',x:G.disc.x,y:G.disc.y,kind:'drop',recv:e,f});return}
  SFX.catch();
  if(!G.demo){G.stats[thrEnt.p.id].c++;G.stats[e.p.id].ct++}
  if(e.x>=90){goal(e,thrEnt);return}
  if(label)banner(label,'',PAL.gold,.9);
  G.holder=e.idx;e.state='holder';e.vx*=.35;e.vy*=.35;
  G.anchor={x:e.x,y:e.y};
  G.phase='live';G.settle=.28;G.stallT=0;G.markerSet=false;G.resetCut=false;G.fake=0;
  computeForce();assignSlots();
  for(const o of G.off)if(o!==e&&(o.state==='jab'||o.state==='scut'||o.state==='linger'))clearOut(o);
  G.activeCut=-1;G.cutGap=rand(.3,.6);G.double=false;
  for(const d of G.def)d.state=d.idx===e.idx?'mark':'guard';
}
function goal(e,thrEnt){
  G.holder=e.idx;e.state='holder';G.flight=null;
  if(G.demo){banner('POINT!',`${e.p.last} from ${thrEnt.p.last}`,PAL.gold,1.6);G.phase='dead';G.deadT=1.8;G.after=()=>setupPossession(rand(20,40),rand(8,32),'');return}
  G.score[0]++;G.stats[e.p.id].g++;G.stats[thrEnt.p.id].a++;
  SFX.score();
  banner('POINT!',`${pname(e.p)} from ${pname(thrEnt.p)}`,PAL.gold,1.8);
  G.phase='dead';G.deadT=2.0;G.after=()=>{G.nextReceiver=1;afterPoint()};
}
function turnover(o){
  const subs={d:o.by?`${pname(o.by.p)} gets the block`:'',block:o.by?`Point-block by ${tag(o.by.p)}`:'',drop:o.recv?`${o.recv.p.last} drops it`:'',turf:'Throwaway',out:'Out of bounds',stall:o.by?`Stall ten. ${o.by.p.last} on the mark`:'Stall ten'};
  SFX.turn();G.lastTO=o.label;G.toCount=(G.toCount||0)+1;
  banner(o.label,subs[o.kind]||'',PAL.red,1.4);
  if(!G.demo){
    const st=G.stats;
    if(o.kind==='drop'&&o.recv)st[o.recv.p.id].to++;
    else if(o.thrower)st[o.thrower.p.id].to++;
    else if(o.f)st[G.off[o.f.thrower].p.id].to++;
  }
  G.flight=null;G.holder=-1;G.disc.x=o.x;G.disc.y=o.y;G.disc.z=0;resetChases();
  G.phase='dead';G.deadT=1.5;
  const x=o.x;
  G.after=G.demo?()=>setupPossession(rand(22,40),rand(8,32),''):()=>startDefense(clamp(x,20,90),false);
}
function stallOut(){
  const h=G.off[G.holder];
  turnover({label:'STALL',x:h.x,y:h.y,by:G.def[h.idx],kind:'stall',thrower:h});
}

// ---------------------------------------------------------------- per-frame logic
function liveLogic(dt){
  if(G.settle>0)G.settle-=dt;
  if(G.markerSet&&G.settle<=0){
    const before=stallNum();G.stallT+=dt;const n=stallNum();
    if(n!==before&&!G.demo&&n>1)SFX.stall(n);
    if(G.stallT>=9*.85+.4){stallOut();return}
  }
  stackLogic(dt);
  if(!G.resetCut&&stallNum()>=6){
    G.resetCut=true;
    const hs=G.off.filter(e=>e.lane==='H'&&e.idx!==G.holder),a=G.anchor;
    const dump=G.style==='horiz'?hs.sort((p,q)=>dist(p.x,p.y,a.x,a.y)-dist(q.x,q.y,a.x,a.y))[0]:hs.find(e=>e.slot===0);
    if(dump){dump.state='cut';dump.timer=1.3;dump.tx=clamp(G.anchor.x-rand(2.5,4),.5,107);dump.ty=clamp(G.anchor.y+G.os*rand(5,8),1.5,38.5)}
  }
  if(G.demo&&G.settle<=0){
    G.demoTimer-=dt;
    if(G.demoTimer<=0){
      const h=G.off[G.holder];let best=null,bs=-1e9;
      for(const e of G.off){
        if(e.idx===G.holder)continue;
        const o=openness(e),dd=dist(e.x,e.y,h.x,h.y);
        if(dd>50||dd<5)continue;
        const fwd=e.x-h.x;
        if(fwd<0&&stallNum()<6)continue; // dump only when the stall is getting up
        const sc=-o*6+fwd*.05;
        if(sc>bs){bs=sc;best=e;best.open=o}
      }
      // wait for someone to get open, unless the stall is getting high
      if(best&&(catchPct(best.open)>=70||stallNum()>=8)){const{ax,ay,huck}=leadSpot(h,best);throwDisc(huck?'huck':'flat',ax,ay,true);G.demoTimer=rand(.9,1.8)}
      else G.demoTimer=.2;
    }
  }
}
function update(dt){
  G.t+=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
  if(G.rain)for(const r of G.rainDrops){r.y+=r.s*dt;r.x-=r.s*.25*dt;if(r.y>H){r.y=-10;r.x=Math.random()*(W+120)}}
  const ph=G.phase;
  if(G.fake>0)G.fake-=dt;if(G.fakeCd>0)G.fakeCd-=dt;
  if(ph==='ready'){G.readyT-=dt;if(G.readyT<=0)G.phase='live'}
  if(!G.demo&&(ph==='live'||ph==='flight'))G.load+=dt*.5;
  for(const t of G.toasts)t.t-=dt;G.toasts=G.toasts.filter(t=>t.t>0);
  if(ph==='ready'||ph==='live'||ph==='flight'||ph==='dead'){
    for(const o of G.off){o.hist.push([G.t,o.x,o.y]);while(o.hist.length>2&&o.hist[0][0]<G.t-1.2)o.hist.shift()}
    if(ph==='live')liveLogic(dt);
    for(const o of G.off)updateOff(o,dt,G.phase);
    for(const d of G.def)updateDef(d,dt,G.phase);
    for(const e of G.off)integrate(e,dt);
    for(const e of G.def)integrate(e,dt);
    for(const o of G.off)for(const d of G.def)if(o.idx!==G.holder||d.state!=='mark')separate(o,d);
    // teammates don't run through each other either (the holder stays on his pivot)
    for(let i=0;i<7;i++)for(let j=i+1;j<7;j++){
      const A=G.off[i],B=G.off[j];
      if(A.idx!==G.holder&&B.idx!==G.holder){separate(A,B,.6);continue}
      const m=A.idx===G.holder?B:A,h=A.idx===G.holder?A:B,dx=m.x-h.x,dy=m.y-h.y,d=Math.hypot(dx,dy);
      if(d<.6&&d>1e-4){m.x=h.x+dx/d*.6;m.y=h.y+dy/d*.6}
    }
    if(G.phase==='flight')updateFlight(dt);
    if(G.holder>=0){
      const h=G.off[G.holder];
      if(G.phase==='live'&&!G.demo&&input.in){const w=mouseWorld();h.face=w.x>=h.x?1:-1}
      G.disc.x=h.x+h.face*.55;G.disc.y=h.y;G.disc.z=1.1;
    }
  }
  if(ph==='dead'){G.deadT-=dt;if(G.deadT<=0){G.phase='wait';const f=G.after;G.after=null;f&&f()}}
  const tx=clamp(G.phase==='flight'?G.disc.x-30:G.disc.x-16,-4,FL+4-VIEW);
  G.camX+=(tx-G.camX)*Math.min(1,dt*2.5);
}

// ---------------------------------------------------------------- defense (simulated, like the other side of the ball in classic arcade football)
function startDefense(x,fromPull){
  if(G.demo)return;
  G.phase='defense';G.holder=-1;
  const yds=Math.round(x-20);
  const T=G.opp.team;
  const where=fromPull?`${esc(T.name)} receives your pull.`:`${esc(T.name)} picks up the disc ${yds} yards from the end zone they attack.`;
  const zoneNote=G.wind.mph>=10?`Strong in this wind (${G.wind.mph} mph).`:`Better when the wind is up. Today: ${G.wind.mph} mph.`;
  ui.innerHTML=`<div class="screen"><div class="panel dpanel">
    <div class="eyebrow">Defense · ${G.score[0]}–${G.score[1]}</div>
    <h2>Call the D</h2>
    <p class="dim">${where} Your line plays it out. Pick the look.</p>
    <div class="choices" id="dchoices">
      <button class="choice" data-key="1" data-s="person"><b><span class="kbd">1</span> Person D</b><span>Everyone takes a mark and grinds. Steady against any offense.</span></button>
      <button class="choice" data-key="2" data-s="zone"><b><span class="kbd">2</span> Zone</b><span>A cup traps the thrower. ${zoneNote} Weak against good throwers.</span></button>
    </div>
    <div class="ticker" id="ticker" hidden></div>
    <div class="row end" id="dfoot"></div>
  </div></div>`;
  ui.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{SFX.click();runDefense(x,fromPull,b.dataset.s)}));
  ui.querySelector('.choice').focus();
}
function simDefense(startX,fromPull,scheme){
  const oR=G.def.map(e=>e.p),mR=G.off.map(e=>e.p);
  G.load+=7;
  const oOff=teamOff(oR),mDef=teamDef(mR),oThr=avg(oR.map(p=>p.thr));
  let p=.5+(oOff-mDef)*.075+(1-(startX-20)/70)*.2;
  if(scheme==='zone')p+=(oThr-5.5)*.05-(G.wind.mph-7)*.014;
  p=clamp(p,.12,.9);
  const scored=Math.random()<p;
  const T=G.opp.team.name;
  const byO=a=>wpick(a,q=>Math.pow(ovr(q),2.2));
  const handlers=oR.filter(q=>q.pos==='H');
  const A=byO(handlers),B=byO(oR.filter(q=>q!==A));
  const lines=[];
  lines.push(fromPull?`${T} catches the pull and walks it up.`:`${T} checks it in.`);
  const mids=[`${tag(A)} swings it to ${tag(B)}.`,`Under cut. ${tag(B)} is open for 10.`,`${tag(A)} breaks the mark to ${tag(B)}.`,`Dump, swing. ${T} resets the stall.`,`${tag(B)} hits the give-go.`];
  shuffle(mids);
  for(let i=0;i<randi(1,2);i++)lines.push(mids[i]);
  const res={scored,lines,dX:20,dPlayer:null};
  if(scored){
    const can=oR.filter(q=>endZoneHands(q,G.opp.team));
    const scorer=byO(can.filter(q=>q.pos!=='H').concat(can)),assist=byO(oR.filter(q=>q!==scorer));
    lines.push(pick([`${tag(assist)} hucks it deep...`,`${tag(assist)} looks up the line...`,`${tag(assist)} flips a hammer over the top...`]));
    lines.push({t:`${tag(scorer)} in the end zone. Point ${T}.`,c:'bad big'});
  }else{
    const r=Math.random();
    const myD=wpick(mR,q=>Math.pow(q.def,2)*(q.id===G.meId?1.6:1));
    const from=byO(oR),to=byO(oR.filter(q=>q!==from));
    res.dX=clamp(lerp(startX,20,rand(.1,.85)),20,88);
    if(r<.55){
      lines.push(`${tag(from)} throws to ${tag(to)}...`);
      lines.push({t:`BLOCKED! ${pname(myD)} gets the D.`,c:'good big'});res.dPlayer=myD;
    }else if(r<.8){
      lines.push(`${tag(from)} puts up a huck...`);
      lines.push({t:scheme==='zone'?'It dies in the wind. Turnover!':'Too long. It sails out the back. Turnover!',c:'good big'});
      res.dX=20;
    }else{
      lines.push(`Stall 7... 8... 9...`);
      lines.push({t:`STALLED! ${pname(myD)} on the mark.`,c:'good big'});res.dPlayer=myD;
    }
  }
  return res;
}
function runDefense(x,fromPull,scheme){
  const res=simDefense(x,fromPull,scheme);
  document.getElementById('dchoices').hidden=true;
  const tk=document.getElementById('ticker');tk.hidden=false;
  let i=0;
  const step=()=>{
    if(i>=res.lines.length){
      res.scored?SFX.turn():SFX.score();
      const foot=document.getElementById('dfoot');if(!foot)return;
      foot.innerHTML=`<button class="btn" data-primary>${res.scored?'Receive the pull':'Take it the other way'} <span class="kbd">Enter</span></button>`;
      foot.querySelector('button').addEventListener('click',()=>finishDefense(res));
      foot.querySelector('button').focus();
      return;
    }
    const l=res.lines[i++];const pEl=document.createElement('p');
    if(typeof l==='string')pEl.textContent=l;else{pEl.textContent=l.t;pEl.className=l.c}
    tk.appendChild(pEl);beep(500+i*60,.03,'square',.02);
    later(step,i===res.lines.length?800:650);
  };
  later(step,250);
}
function finishDefense(res){
  ui.innerHTML='';
  if(res.scored){G.score[1]++;G.nextReceiver=0;afterPoint()}
  else{
    if(res.dPlayer&&G.stats[res.dPlayer.id])G.stats[res.dPlayer.id].d++;
    setupPossession(res.dX,rand(6,34),'YOUR DISC');
  }
}
function afterPoint(){
  endPointFatigue();
  const t=G.target;
  if(G.score[0]>=t||G.score[1]>=t){endMatch();return}
  if(!G.halfDone&&Math.max(G.score[0],G.score[1])>=Math.ceil(t/2)){
    G.halfDone=true;G.nextReceiver=1-G.firstReceiver;G.phase='wait';SFX.whistle();
    for(const id in G.en)G.en[id]=Math.min(100,G.en[id]+35);
    ui.innerHTML=`<div class="screen"><div class="panel" style="align-items:center;text-align:center">
      <div class="eyebrow">Halftime</div><h2>${esc(G.me.team.abbr)} ${G.score[0]} – ${G.score[1]} ${esc(G.opp.team.abbr)}</h2>

function endMatch(){

function drawPlayer(e,col){

  const moving=Math.hypot(e.vx,e.vy)>.8,fr=moving&&Number.isFinite(e.anim)?((Math.floor(e.anim*1.4)%4)+4)%4:0;

function drawGroundLayer(){
  if(!(G.phase==='live'||G.phase==='ready')||G.demo)return;
  for(const e of G.off){
    if(e.idx===G.holder)continue;
    const o=openCached(e),c=openColor(o);
    const X=sx(e.x),Y=sy(e.y);
    ctx.globalAlpha=.9;
    rect(X-9,Y-1,18,2,c);rect(X-11,Y+1,3,2,c);rect(X+8,Y+1,3,2,c);rect(X-9,Y+3,18,2,c);
    ctx.globalAlpha=1;
  }
  // mark wedge

    for(let a=-.8;a<=.8001;a+=.1){const A=G.markAng+a;ctx.lineTo(sx(h.x+Math.cos(A)*5),sy(h.y+Math.sin(A)*5))}
    ctx.closePath();
    ctx.fillStyle=G.fake>0?'rgba(255,107,93,.07)':'rgba(255,107,93,.24)';ctx.fill();

function drawAim(){
  if(!input.in||!canAim()){G.aimR=null;return}
  const{h,tx,ty,d,huck,over}=mouseAim(input.shift);
  const b=bendOf(h.x,h.y,tx,ty,G.lean||0);
  const relIn=Math.abs(angDiff(b.rel,G.markAng))<.8,straightIn=Math.abs(angDiff(b.straight,G.markAng))<.8;
  const inW=relIn&&G.fake<=0,around=!relIn&&straightIn&&G.lean&&G.fake<=0;
  const c=over?PAL.red:inW?PAL.sunset:PAL.chalk;
  const apex=arcOf(huck?'huck':'flat',d);
  for(let s=.06;s<1;s+=huck?.04:.05){
    const o=bendAt(b,s),x=lerp(h.x,tx,s)+b.nx*o,y=lerp(h.y,ty,s)+b.ny*o,z=(huck?lerp(1.5,1,s):lerp(1.4,1,s))+4*apex*s*(1-s);
    rect(sx(x)-1,sy(y)-Math.round(z*ZH)-6,2,2,c);
  }
  const X=sx(tx),Y=sy(ty);
  // the accuracy circle: where the disc could actually land with this thrower
  const er=throwErr(h.p.thr,d,huck?'huck':'flat')*1.2;
  ctx.globalAlpha=.35;ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(X,Y,Math.max(4,er*PPY),Math.max(2.5,er*SQ),0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  rect(X-6,Y,4,2,c);rect(X+3,Y,4,2,c);rect(X,Y-4,2,3,c);rect(X,Y+3,2,3,c);
  text(`${huck?'HUCK':'FLAT'} ${Math.round(d)}YD`,X+14,Y-6,10,c,'left');
  if(inW)text('INTO THE MARK',X+14,Y+8,9,PAL.sunset,'left');
  else if(around)text('AROUND THE MARK',X+14,Y+8,9,PAL.sea,'left');
  G.aimR=chooseReceiver(tx,ty)||null;
  h.face=tx>=h.x?1:-1;
}

let lastT=performance.now();
let loopErrors=0;
function loop(now){
  // the first frame's timestamp can be a hair before the page's start time; never step backwards
  const dt=clamp((now-lastT)/1000,0,.05);lastT=now;
  try{if(G&&!G.paused)update(dt);render()}
  catch(err){if(loopErrors++<3)console.error(err)} // one bad frame must never freeze the game
  requestAnimationFrame(loop);
}

function startDemo(){
