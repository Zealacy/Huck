// ---------------------------------------------------------------- seasons (shared by every program)
// Career mode (playing as one player) was removed to focus on head coach mode. It is archived in
// archive/career-mode/ with notes on how to add it back.
let CAR=null; // the program being played
function migrate(c){
  if(!c||!c.rosters)return null;
  if(c.me&&c.me.sta==null)c.me.sta=3;
  if(c.mode==='coach'&&!STYLES.includes(c.style))c.style='vert'; // saves from before offense styles
  delete c.playbook; // left over from the removed playbook
  for(const t of TEAMS){
    if(!c.rosters[t.id]){c.prestige[t.id]=t.elite?5:randi(1,5);c.rosters[t.id]=genRoster(Math.random,c.prestige[t.id],t.elite)}
    // saves from before deeper rosters and stamina
    const ro=c.rosters[t.id],used=new Set(ro.map(p=>p.num).concat(t.id===c.teamId&&c.me?[c.me.num]:[]));
    for(const p of ro){
      if(p.sta==null)p.sta=clamp(Math.round((p.thr+p.spd+p.hnd+p.jmp+p.def)/5+rand(-1,1)),1,10);
      if(p.tier==null)p.tier=ovr(p)>=8?2:ovr(p)>=6.8?1:0;
      if(p.pot==null)setPot(p,Math.random);
    }
    while(ro.length<(t.id===c.teamId&&c.mode!=='coach'?13:14)){const p=genPlayer(Math.random,ROSTER_POS[ro.length]||'C',0,used);shapeTier(p,0,Math.random);setPot(p,Math.random);ro.push(p)}
    if(c.season&&c.season.standings&&!c.season.standings[t.id])c.season.standings[t.id]={w:0,l:0,pf:0,pa:0};
  }
  return c;
}
function saveProgram(){try{if(CAR)localStorage.setItem(COACH_KEY,JSON.stringify(CAR))}catch(e){}}
function myRoster(){return CAR.rosters[CAR.teamId]}
function rosterOf(id){return id===CAR.teamId?myRoster():CAR.rosters[id]}

function newSeason(){
  const my=TEAM(CAR.teamId);
  const others=shuffle(TEAMS.filter(t=>t.id!==CAR.teamId));
  const same=others.filter(t=>t.st===my.st),diff=others.filter(t=>t.st!==my.st);
  const nSame=Math.min(5,same.length);
  const opps=shuffle(same.slice(0,nSame).concat(diff.slice(0,8-nSame)));
  const EV={WA:['Rainy City Invite','Cascade Cup','Puget Sound Showdown'],OR:['Rose City Classic','Willamette Weekend','Track Town Classic'],CA:['Golden Gate Open','Bay Bash','Redwood Shootout']};
  CAR.season={schedule:opps.map((t,i)=>({opp:t.id,home:i%2===0,event:pick(EV[t.st]),res:null})),week:0,
    standings:Object.fromEntries(TEAMS.map(t=>[t.id,{w:0,l:0,pf:0,pa:0}])),phase:'reg',bracket:null,round:0,seeds:null,finish:null,champ:null,
    stats:{gp:0,w:0,l:0,g:0,a:0,d:0,c:0,ct:0,to:0},awards:[],pstats:{}};
}
function simScore(a,b){
  const ra=teamRating(rosterOf(a))+(CAR.prestige[a]-3)*.1,rb=teamRating(rosterOf(b))+(CAR.prestige[b]-3)*.1;
  const pa=1/(1+Math.exp(-(ra-rb)*1.6));
  const aw=Math.random()<pa;
  const lose=clamp(Math.round(4.5-Math.abs(ra-rb)*1.5+rand(-2.5,2)),0,6);
  return aw?[7,lose]:[lose,7];
}
function addStanding(a,b,sa,sb){
  const S=CAR.season.standings;
  S[a].pf+=sa;S[a].pa+=sb;S[b].pf+=sb;S[b].pa+=sa;
  if(sa>sb){S[a].w++;S[b].l++}else{S[b].w++;S[a].l++}
}
function simWeek(exclude){
  const ids=shuffle(TEAMS.map(t=>t.id).filter(id=>!exclude.includes(id)));
  for(let i=0;i+1<ids.length;i+=2){const[sa,sb]=simScore(ids[i],ids[i+1]);addStanding(ids[i],ids[i+1],sa,sb)}
}
function sortedStandings(){
  const S=CAR.season.standings;
  return TEAMS.map(t=>t.id).sort((a,b)=>(S[b].w-S[a].w)||((S[b].pf-S[b].pa)-(S[a].pf-S[a].pa))||(teamRating(rosterOf(b))-teamRating(rosterOf(a))));
}
function simMatch(m){const[sa,sb]=simScore(m.a,m.b);m.res=[sa,sb];m.win=sa>sb?m.a:m.b}
function buildNextRound(){
  const S=CAR.season,prev=S.bracket[S.round-1],w=prev.map(m=>m.win),next=[];
  for(let i=0;i<w.length;i+=2)next.push({a:w[i],b:w[i+1]});
  S.bracket.push(next);
}
function finishBracket(){
  const S=CAR.season;
  while(true){
    const r=S.bracket[S.round];
    for(const m of r)if(!m.win)simMatch(m);
    if(r.length===1){S.champ=r[0].win;break}
    S.round++;buildNextRound();
  }
}
function startPlayoffs(){
  const S=CAR.season;
  S.seeds=sortedStandings().slice(0,8);
  const s=S.seeds;
  S.bracket=[[{a:s[0],b:s[7]},{a:s[3],b:s[4]},{a:s[1],b:s[6]},{a:s[2],b:s[5]}]];S.round=0;
  if(!s.includes(CAR.teamId)){S.phase='done';S.finish='Missed the Pacific Championships';finishBracket();endSeasonAwards()}
  else S.phase='po';
}
function nextGame(){
  const S=CAR.season;
  if(S.phase==='reg'){const g=S.schedule[S.week];return{opp:g.opp,home:g.home,label:`Week ${S.week+1} of ${S.schedule.length} · ${g.event}`,kind:'reg'}}
  if(S.phase==='po'){
    const m=S.bracket[S.round].find(m=>m.a===CAR.teamId||m.b===CAR.teamId);
    const opp=m.a===CAR.teamId?m.b:m.a;
    return{opp,home:S.seeds.indexOf(CAR.teamId)<S.seeds.indexOf(opp),label:`Pacific Championships · ${['Quarterfinal','Semifinal','Final'][S.round]}`,kind:'po',m};
  }
  return null;
}
function recordResult(res,ng){
  const S=CAR.season;
  if(ng.kind==='reg'){
    S.schedule[S.week].res=[res.us,res.them];addStanding(CAR.teamId,ng.opp,res.us,res.them);simWeek([CAR.teamId,ng.opp]);S.week++;
    if(S.week>=S.schedule.length)startPlayoffs();
  }else{
    const r=S.bracket[S.round],m=ng.m;
    m.res=m.a===CAR.teamId?[res.us,res.them]:[res.them,res.us];m.win=res.win?CAR.teamId:ng.opp;
    for(const mm of r)if(!mm.win)simMatch(mm);
    if(!res.win){S.finish=['Lost in the quarterfinal','Lost in the semifinal','Runner-up'][S.round];S.phase='done';finishBracket();endSeasonAwards()}
    else if(S.round===2){S.finish='Pacific Champions';S.champ=CAR.teamId;S.phase='done';CAR.titles++;endSeasonAwards()}
    else{S.round++;buildNextRound()}
  }
}
function endSeasonAwards(){coachSeasonEnd()}

function playerXP(s,pts,win,playoff){
  if(!pts)return 0;

  const hs=ro.filter(p=>p.pos==='H').sort((a,b)=>sc(b)-sc(a)).slice(0,kind==='O'?3:2);

function genRecruits(){
  const lv=CAR.fac.scout,used=new Set(myRoster().map(p=>p.num)),out=[];
  for(let i=0;i<5+lv;i++){
    const r=Math.random(),tier=r<.03+.02*lv?2:r<.18+.06*lv?1:0;
    const p=genPlayer(Math.random,pick(['H','H','C','C','C','D']),tier,used,9);shapeTier(p,tier,Math.random);
    p.pot=tier===0?rand(4.6,6.75):TIER_POT[tier]-Math.random()*.3;
    for(let k=0;k<[3,4,5][tier];k++){const a=pick(ATTR);p[a]=Math.max(1,p[a]-1)} // freshmen arrive raw
    while(ovr(p)>p.pot){const c=ATTR.filter(a=>p[a]>1);p[pick(c)]--}
    const cs=starsAt(p.pot);
    if(lv>=3){p.ceilLo=p.ceilHi=cs}else{p.ceilLo=clamp(cs-(Math.random()<.5?1:0),1,5);p.ceilHi=clamp(p.ceilLo+1,1,5);if(cs>p.ceilHi)p.ceilLo=(p.ceilHi=cs)-1}
    p.cost=tier===2?9:tier===1?5:cs>=3?2:1;
    out.push(p);
  }
  return out.sort((a,b)=>b.pot-a.pot);
}

function finishRecruiting(){

  const signed=O.recruits.filter(p=>O.signed.includes(p.id));
  CAR.cc-=signed.reduce((t,p)=>t+p.cost,0);

    for(let k=0;k<1+CAR.fac.train;k++)if(Math.random()<.7&&ovr(p)<(p.pot||9)){const c=ATTR.filter(a=>p[a]<10);if(c.length)p[pick(c)]++}

        const np=genPlayer(Math.random,q.pos,tier,u2,9);shapeTier(np,tier,Math.random);np.pot=TIER_POT[tier]-Math.random()*.3;
        for(let k=0;k<4;k++){const a=pick(ATTR);np[a]=Math.max(1,np[a]-1)}r2[i]=np}
      else for(let k=0;k<2;k++)if(Math.random()<.7&&ovr(q)<(q.pot||9)){const a=pick(ATTR);q[a]=clamp(q[a]+1,1,10)}
    }
    CAR.prestige[t.id]=clamp(CAR.prestige[t.id]+randi(-1,1),t.elite?4:1,5);
  }
  const ids=new Set(ro.map(q=>q.id));
  CAR.lines={O:CAR.lines.O.filter(id=>ids.has(id)),D:CAR.lines.D.filter(id=>ids.has(id))};
  CAR.year++;CAR.cc+=2;CAR.offseason=null;
  newSeason();saveProgram();
  gains.sort((a,b)=>b.d-a.d);
  show(`<div class="screen"><div class="panel" style="width:calc(var(--u)*640)">
    <div class="eyebrow">Year ${CAR.year} · ${esc(my.name)}</div><h2>Offseason report</h2>
    <h3>Biggest jumps</h3>
    <div class="small">${gains.slice(0,6).map(g=>`${esc(pname(g.p))} +${g.d.toFixed(1)} OVR ${'★'.repeat(starsOf(g.p))}`).join('<br>')||'Nobody improved much. A bigger training center helps.'}</div>
    <h3>New faces</h3>
    <div class="small">${signed.map(p=>`${esc(pname(p))} (${p.pos}, recruit)`).concat(walk.map(p=>`${esc(pname(p))} (${p.pos}, walk-on)`)).join('<br>')||'No new players.'}</div>
    <p class="dim small">Boosters chipped in 2 CC. Returning players keep their unspent skill points. Check your lines: graduates were taken off them.</p>
    <div class="row end"><button class="btn" id="rhub" data-primary>To the new season <span class="kbd">Enter</span></button></div>
  </div></div>`);
  on('rhub',showCoachHub);
}

// ---------------------------------------------------------------- layout + boot
function fit(){
  const r=wrap.getBoundingClientRect();
  const s=Math.max(.2,Math.min(r.width/W,r.height/H));
  frame.style.width=Math.floor(W*s)+'px';frame.style.height=Math.floor(H*s)+'px';frame.style.setProperty('--u',s+'px');
}
window.addEventListener('resize',fit);
function boot(data){
  fit();
  if(data&&data.coach)try{localStorage.setItem(COACH_KEY,JSON.stringify(data.coach))}catch(e){}
  showTitle();
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({coach:loadCoach()}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
window.__huck={get G(){return G},get CAR(){return CAR},throwDisc,startCoach:id=>startCoach(id),step:dt=>update(dt),openness:e=>openness(e),leadSpot:(h,e)=>leadSpot(h,e),catchPct:o=>catchPct(o),setupPossession:(x,y,l)=>setupPossession(x,y,l),slotPos:e=>slotPos(e),stallNum:()=>stallNum()};
})();
</script>
