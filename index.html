<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacific Huck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one arcade screen. A 16:9 pixel field scaled to fit the window, with chunky menus floating over it. Single dark look by choice. */
:root{
  --night:#14202e;
  --panel:#1f3044;
  --panel-2:#2b4560;
  --line:#7a95b0;
  --chalk:#f3efe2;
  --dim:#a9b8c6;
  --sunset:#ff8f3d;
  --sunset-deep:#b8541a;
  --sea:#6fd0c1;
  --gold:#ffd25a;
  --red:#ff6b5d;
  --ink:#0b121a;
  --scrim:rgba(11,18,26,.82);
  --shadow:rgba(0,0,0,.4);
  --font-display:"Silkscreen","Courier New",monospace;
  --font-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--font-body);box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#wrap{height:100%;width:100%;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:960px;height:540px;--u:1px;flex:none;
  box-shadow:0 0 0 calc(var(--u)*4) var(--panel-2),0 calc(var(--u)*14) calc(var(--u)*40) var(--shadow)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;background:var(--ink)}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*16);line-height:1.3}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);pointer-events:auto}
.screen.clear{background:linear-gradient(180deg,transparent 0%,transparent 35%,var(--scrim) 100%)}
.panel{background:var(--panel);border:calc(var(--u)*3) solid var(--line);
  box-shadow:inset 0 0 0 calc(var(--u)*3) var(--panel-2),calc(var(--u)*6) calc(var(--u)*6) 0 var(--shadow);
  padding:calc(var(--u)*18) calc(var(--u)*22);max-height:calc(100% - var(--u)*28);max-width:calc(100% - var(--u)*28);
  box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:calc(var(--u)*12)}
.panel::-webkit-scrollbar{width:calc(var(--u)*8)}
.panel::-webkit-scrollbar-thumb{background:var(--line)}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance;letter-spacing:.02em}
h2{font-size:calc(var(--u)*26)}
h3{font-size:calc(var(--u)*15);color:var(--gold)}
p{margin:0}
.eyebrow{font-family:var(--font-display);font-size:calc(var(--u)*11);letter-spacing:.12em;text-transform:uppercase;color:var(--sea)}
.dim{color:var(--dim)}
.row{display:flex;gap:calc(var(--u)*10);align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.btn{font-family:var(--font-display);font-weight:700;font-size:calc(var(--u)*15);background:var(--sunset);color:var(--ink);border:0;
  padding:calc(var(--u)*9) calc(var(--u)*16);cursor:pointer;box-shadow:0 calc(var(--u)*4) 0 var(--sunset-deep);
  position:relative;top:0;letter-spacing:.04em;text-transform:uppercase}
.btn:hover{filter:brightness(1.08)}
.btn:active{top:calc(var(--u)*3);box-shadow:0 calc(var(--u)*1) 0 var(--sunset-deep)}
.btn:focus-visible,.tile:focus-visible,.pos-card:focus-visible,.plus:focus-visible,input:focus-visible{outline:calc(var(--u)*3) solid var(--gold);outline-offset:calc(var(--u)*2)}
.btn.alt{background:var(--panel-2);color:var(--chalk);box-shadow:0 calc(var(--u)*4) 0 var(--ink)}
.btn.small{font-size:calc(var(--u)*12);padding:calc(var(--u)*6) calc(var(--u)*10)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.kbd{font-family:var(--font-display);font-size:.8em;background:var(--chalk);color:var(--ink);padding:0 calc(var(--u)*5);box-shadow:0 calc(var(--u)*2) 0 var(--line);white-space:nowrap}
/* title */
.titlebox{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14);margin-top:calc(var(--u)*120)}
.logo{font-family:var(--font-display);font-weight:700;line-height:.9;text-align:center;color:var(--chalk);
  text-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 var(--sunset-deep),calc(var(--u)*8) calc(var(--u)*8) 0 var(--ink)}
.logo .a{display:block;font-size:calc(var(--u)*30);letter-spacing:.3em;color:var(--sea);text-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 var(--ink)}
.logo .b{display:block;font-size:calc(var(--u)*92);letter-spacing:.04em;color:var(--sunset)}
.tag{font-size:calc(var(--u)*18);color:var(--chalk);text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
.menu{display:flex;gap:calc(var(--u)*12);flex-wrap:wrap;justify-content:center}
.foot{font-size:calc(var(--u)*13);color:var(--dim);text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
/* team picker */
.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*14)}
.state-col{display:flex;flex-direction:column;gap:calc(var(--u)*6);min-width:0}
.tile{display:flex;align-items:center;gap:calc(var(--u)*10);background:var(--panel-2);border:0;color:var(--chalk);text-align:left;
  padding:calc(var(--u)*7) calc(var(--u)*9);cursor:pointer;font-family:var(--font-body);font-size:calc(var(--u)*15);box-shadow:0 calc(var(--u)*3) 0 var(--ink)}
.tile:hover{background:var(--line);color:var(--ink)}
.tile[disabled]{opacity:.3;cursor:not-allowed}
.tile small{display:block;font-size:calc(var(--u)*12);color:inherit;opacity:.75}
.jersey{width:calc(var(--u)*22);height:calc(var(--u)*24);flex:none;position:relative}
.jersey i{position:absolute;left:0;right:0;top:0;height:62%}
.jersey b{position:absolute;left:15%;right:15%;bottom:0;height:34%}
/* pregame */
.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:calc(var(--u)*16);align-items:start}
.vs{font-family:var(--font-display);font-size:calc(var(--u)*30);color:var(--sunset);align-self:center}
.side{display:flex;flex-direction:column;gap:calc(var(--u)*6);min-width:0}
.side.right{text-align:right;align-items:flex-end}
.side h2{font-size:calc(var(--u)*22)}
.ratings{font-family:var(--font-display);font-size:calc(var(--u)*12);color:var(--dim);font-variant-numeric:tabular-nums}
.ratings b{color:var(--chalk)}
.star-list{display:flex;flex-direction:column;gap:calc(var(--u)*3);font-size:calc(var(--u)*14)}
.stars{color:var(--gold);letter-spacing:.06em;font-family:var(--font-body)}
.conditions{font-size:calc(var(--u)*14);color:var(--dim);border-top:calc(var(--u)*2) dashed var(--panel-2);padding-top:calc(var(--u)*10)}
/* tables */
table{border-collapse:collapse;width:100%;font-size:calc(var(--u)*14);font-variant-numeric:tabular-nums}
th{font-family:var(--font-display);font-size:calc(var(--u)*10);color:var(--sea);text-align:left;padding:calc(var(--u)*3) calc(var(--u)*6);letter-spacing:.08em}
td{padding:calc(var(--u)*3) calc(var(--u)*6);border-top:calc(var(--u)*1) solid var(--panel-2)}
td.n,th.n{text-align:right;white-space:nowrap}
td.trunc{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.me td{background:var(--panel-2);color:var(--gold)}
/* how-to */
.how{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--u)*18);max-width:calc(var(--u)*780)}
.how ul{margin:0;padding-left:calc(var(--u)*18);display:flex;flex-direction:column;gap:calc(var(--u)*6);font-size:calc(var(--u)*15)}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*8) calc(var(--u)*12);font-size:calc(var(--u)*15);align-items:center}
/* defense */
.dpanel{width:calc(var(--u)*560)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*10)}
.choice{background:var(--panel-2);border:0;color:var(--chalk);text-align:left;padding:calc(var(--u)*10) calc(var(--u)*12);cursor:pointer;
  font-family:var(--font-body);font-size:calc(var(--u)*14);display:flex;flex-direction:column;gap:calc(var(--u)*4);box-shadow:0 calc(var(--u)*3) 0 var(--ink)}
.choice b{font-family:var(--font-display);font-size:calc(var(--u)*15);color:var(--gold)}
.choice:hover,.choice:focus-visible{background:var(--line);color:var(--ink);outline:none}
.choice:hover b,.choice:focus-visible b{color:var(--ink)}
.ticker{font-size:calc(var(--u)*16);display:flex;flex-direction:column;gap:calc(var(--u)*5);min-height:calc(var(--u)*130)}
.ticker p{animation:tick .25s steps(3) both}
.ticker .big{font-family:var(--font-display);font-size:calc(var(--u)*20)}
.good{color:var(--sea)}.bad{color:var(--red)}.gold{color:var(--gold)}
@keyframes tick{from{opacity:0;transform:translateX(calc(var(--u)*-8))}to{opacity:1;transform:none}}
/* career */
.hub{width:calc(var(--u)*900)}
.hub-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:calc(var(--u)*14)}
.card{background:var(--ink);padding:calc(var(--u)*12) calc(var(--u)*14);display:flex;flex-direction:column;gap:calc(var(--u)*9);min-width:0}
.me-name{font-family:var(--font-display);font-size:calc(var(--u)*20);line-height:1.1}
.attr{display:grid;grid-template-columns:calc(var(--u)*78) minmax(0,1fr) calc(var(--u)*22) calc(var(--u)*64);gap:calc(var(--u)*8);align-items:center;font-size:calc(var(--u)*14)}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:calc(var(--u)*2);height:calc(var(--u)*12)}
.pips span{background:var(--panel-2)}
.pips span.on{background:var(--sea)}
.attr .v{font-family:var(--font-display);text-align:right}
.plus{font-family:var(--font-display);font-size:calc(var(--u)*11);background:var(--gold);color:var(--ink);border:0;padding:calc(var(--u)*4) calc(var(--u)*4);cursor:pointer;white-space:nowrap}
.plus[disabled]{background:var(--panel-2);color:var(--dim);cursor:not-allowed}
.xpbar{height:calc(var(--u)*10);background:var(--panel-2);position:relative}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
.sp{font-family:var(--font-display);font-size:calc(var(--u)*13);color:var(--gold)}
.sched{display:flex;flex-direction:column;gap:calc(var(--u)*2);font-size:calc(var(--u)*14)}
.sched div{display:grid;grid-template-columns:calc(var(--u)*28) minmax(0,1fr) auto;gap:calc(var(--u)*8);padding:calc(var(--u)*2) calc(var(--u)*4)}
.sched div.next{background:var(--panel-2);color:var(--gold)}
.nextbox{background:var(--panel-2);padding:calc(var(--u)*10) calc(var(--u)*12);display:flex;flex-direction:column;gap:calc(var(--u)*8)}
.nextbox .big{font-family:var(--font-display);font-size:calc(var(--u)*18)}
.pos-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*10)}
.pos-card{background:var(--panel-2);border:calc(var(--u)*3) solid transparent;color:var(--chalk);text-align:left;padding:calc(var(--u)*10);cursor:pointer;
  font-family:var(--font-body);font-size:calc(var(--u)*13);display:flex;flex-direction:column;gap:calc(var(--u)*4)}
.pos-card b{font-family:var(--font-display);font-size:calc(var(--u)*15)}
.pos-card[aria-pressed="true"]{border-color:var(--gold);background:var(--ink)}
.field{display:flex;flex-direction:column;gap:calc(var(--u)*4);font-size:calc(var(--u)*13);color:var(--dim);min-width:0}
input{font-family:var(--font-body);font-size:calc(var(--u)*17);background:var(--ink);color:var(--chalk);border:calc(var(--u)*2) solid var(--line);padding:calc(var(--u)*6) calc(var(--u)*8);width:100%;box-sizing:border-box}
.form-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) calc(var(--u)*90) auto;gap:calc(var(--u)*10);align-items:end}
.badge{display:inline-block;font-family:var(--font-display);font-size:calc(var(--u)*11);background:var(--gold);color:var(--ink);padding:calc(var(--u)*2) calc(var(--u)*6)}
.levelup{font-family:var(--font-display);color:var(--gold);font-size:calc(var(--u)*16)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--u)*16)}
@media (prefers-reduced-motion:reduce){.ticker p{animation:none}}
</style>
</head>
<body>

<div id="wrap"><div id="frame">
  <canvas id="cv" width="960" height="540" aria-label="Pacific Huck game field"></canvas>
  <div id="ui"></div>
</div></div>

<script>
(()=>{
'use strict';
// ---------------------------------------------------------------- constants
const W=960,H=540,PPY=12,SQ=8.6,FT=170,ZH=10,P=2,FL=110,FW=40,VIEW=W/PPY;
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),ui=document.getElementById('ui'),frame=document.getElementById('frame'),wrap=document.getElementById('wrap');
ctx.imageSmoothingEnabled=false;
const PAL={night:'#14202e',panel:'#1f3044',panel2:'#2b4560',chalk:'#f3efe2',dim:'#a9b8c6',sunset:'#ff8f3d',sea:'#6fd0c1',gold:'#ffd25a',red:'#ff6b5d',ink:'#0b121a',cone:'#ff7a1a'};
const FONT='Silkscreen, "Courier New", monospace';
const SAVE_KEY='pacific-huck-career-v1';

// ---------------------------------------------------------------- helpers
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
const rand=(a,b)=>a+(b-a)*Math.random();
const randi=(a,b)=>Math.floor(a+(b-a+1)*Math.random());
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wpick(arr,wf){const ws=arr.map(wf);let s=ws.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<arr.length;i++){s-=ws[i];if(s<=0)return arr[i]}return arr[arr.length-1]}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function colorClose(a,b){const x=hexRgb(a),y=hexRgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])<120}

// ---------------------------------------------------------------- teams (real West Coast high school programs and their school colors)
const TEAMS=[
 {id:'lks',name:'Lakeside',city:'Seattle',st:'WA',abbr:'LKS',c1:'#7a1f2b',c2:'#f2c14e'},
 {id:'gar',name:'Garfield',city:'Seattle',st:'WA',abbr:'GAR',c1:'#5b2d8e',c2:'#f4f4f4'},
 {id:'roo',name:'Roosevelt',city:'Seattle',st:'WA',abbr:'RHS',c1:'#1f8a3a',c2:'#f2c230'},
 {id:'bal',name:'Ballard',city:'Seattle',st:'WA',abbr:'BAL',c1:'#c8102e',c2:'#111111'},
 {id:'bai',name:'Bainbridge',city:'Bainbridge Island',st:'WA',abbr:'BAI',c1:'#13294b',c2:'#f1b82d'},
 {id:'nws',name:'Northwest School',city:'Seattle',st:'WA',abbr:'NWS',c1:'#7b1e34',c2:'#f2f2f2'},
 {id:'gra',name:'Grant',city:'Portland',st:'OR',abbr:'GRA',c1:'#1f4fa0',c2:'#a3abb3'},
 {id:'lin',name:'Lincoln',city:'Portland',st:'OR',abbr:'LIN',c1:'#c8102e',c2:'#f4f4f4'},
 {id:'cle',name:'Cleveland',city:'Portland',st:'OR',abbr:'CLE',c1:'#2a9d3c',c2:'#ffe14d'},
 {id:'cgs',name:'Catlin Gabel',city:'Portland',st:'OR',abbr:'CGS',c1:'#1f4ed8',c2:'#f4f4f4'},
 {id:'seh',name:'South Eugene',city:'Eugene',st:'OR',abbr:'SEH',c1:'#4b2e83',c2:'#f4f4f4',elite:true},
 {id:'pal',name:'Palo Alto',city:'Palo Alto',st:'CA',abbr:'PAL',c1:'#0b6b3a',c2:'#f4f4f4'},
 {id:'gun',name:'Gunn',city:'Palo Alto',st:'CA',abbr:'GUN',c1:'#b0151d',c2:'#111111'},
 {id:'bhs',name:'Berkeley',city:'Berkeley',st:'CA',abbr:'BHS',c1:'#c1121f',c2:'#f5c518'},
 {id:'bod',name:"Bishop O'Dowd",city:'Oakland',st:'CA',abbr:'BOD',c1:'#161616',c2:'#d4a72c'},
 {id:'men',name:'Menlo School',city:'Atherton',st:'CA',abbr:'MEN',c1:'#0b2a5b',c2:'#e8b52a'},
 {id:'lws',name:'Lick-Wilmerding',city:'San Francisco',st:'CA',abbr:'LWS',c1:'#141414',c2:'#f0b323'},
];
const TEAM=id=>TEAMS.find(t=>t.id===id);
const STATE_NAME={WA:'Washington',OR:'Oregon',CA:'California'};

// ---------------------------------------------------------------- players (all fictional, generated)
const FIRST=['Kai','Maya','Leo','Aiden','Sofia','Mateo','Priya','Jonah','Ava','Ethan','Noah','Lila','Isaac','Ruby','Hana','Kenji','Diego','Zoe','Theo','Eli','Nora','Owen','Ari','Jada','Malik','Wren','Finn','Quinn','Rowan','Sage','Talia','Marcus','Ezra','Ines','Luca','Amara','Devin','Tenzin','Anika','Sam','Jordan','Riley','Cam','Nico','Iris','Mina','Desmond','Felix','Gabe','Hugo','Leah','Mira','Remy','Soren','Tessa','Uma','Yuki','Zane','Omar','Lena','Bodhi','Callum','Esme','Ronan','Sasha','Tomas','Vera','Wes','Imani','Jasper'];
const LAST=['Nakamura','Ramos','Chen','Okafor','Patel','Larsen','Nguyen','Brooks','Alvarez','Kim','Olsen','Hughes','Moreno','Park','Haddad','Bennett','Tanaka','Silva','Reyes','Fischer','Kaur','Lindqvist','Morales','Ito','Walsh','Delgado','Abbott','Yamamoto','Castillo','Novak','Sorensen','Huang','Mendez','Foster','Osei','Pham','Becker','Rivera','Sato','Hale','Kowalski','Dang','Ortiz','Wu','Lee','Hart','Price','Bjornson','Fujita','Galvan','Iverson','Quintero','Strand','Vu','Zamora','Torres','Adeyemi','Marsh','Oyelaran','Whitlock'];
const SKIN=['#f1c9a5','#e0b08a','#c68a5e','#9a6440','#6b432a'];
const HAIR=['#2b1d14','#5a3a1e','#a0522d','#e2c27a','#141414','#7b3f00','#b8462e'];
const ATTR=['thr','spd','hnd','jmp','def'];
const ATTR_NAME={thr:'Throws',spd:'Speed',hnd:'Hands',jmp:'Hops',def:'Defense'};
const ATTR_HINT={thr:'Range, accuracy, beating the mark',spd:'Getting open, running down hucks',hnd:'Catch rate and layout grabs',jmp:'Winning sky battles on hucks',def:'Getting blocks when you play D'};
const POS={H:'Handler',C:'Cutter',D:'Defender'};
const GRADE={9:'Freshman',10:'Sophomore',11:'Junior',12:'Senior'};
const ovr=p=>ATTR.reduce((s,a)=>s+p[a],0)/5;
const starsOf=p=>clamp(Math.round((ovr(p)-2.2)/1.4),1,5);
const starStr=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const pname=p=>`${p.first} ${p.last}`;
const tag=p=>`#${p.num} ${p.last}`;

function genPlayer(r,pos,tier,used,grade){
  const base=[4.1,6.6,7.9][tier];
  const bias={H:{thr:2,hnd:1,spd:-.5,jmp:-.7,def:-.6},C:{thr:-1,spd:1.5,hnd:1,jmp:1,def:-.6},D:{thr:-1,spd:1,hnd:-.5,jmp:1,def:2}}[pos];
  const p={id:'p'+Math.floor(r()*2e9).toString(36),first:pick(FIRST,r),last:pick(LAST,r),pos,skin:Math.floor(r()*SKIN.length),hair:Math.floor(r()*HAIR.length),style:Math.floor(r()*3),grade:grade||9+Math.floor(r()*4)};
  for(const a of ATTR)p[a]=clamp(Math.round(base+bias[a]+(r()*2.6-1.3)),1,10);
  let n;do{n=Math.floor(r()*100)}while(used.has(n));used.add(n);p.num=n;
  return p;
}
function genRoster(r,prestige,elite){
  const used=new Set(),pos=['H','H','H','C','C','C','D'];
  const nStars=elite?4:prestige>=4?3:prestige>=2?2:1;
  const tiers=pos.map(()=>0);
  shuffle([0,1,2,3,4,5,6],r).slice(0,nStars).forEach((i,k)=>tiers[i]=(k===0&&prestige>=4)||(k===1&&elite)?2:1);
  const ro=pos.map((ps,i)=>genPlayer(r,ps,tiers[i],used));
  const adj=(prestige-3)*.4+(elite?.7:0);
  ro.forEach(p=>{for(const a of ATTR)if(elite||r()<.6)p[a]=clamp(Math.round(p[a]+adj),1,10)});
  return ro;
}
const teamOff=ro=>avg(ro.map(p=>p.thr*.4+p.hnd*.3+p.spd*.3));

function beep(f,d=.08,type='square',v=.05,slide=0,delay=0){
  const a=audio();if(!a||muted)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);
}
const SFX={
  throw:()=>beep(620,.12,'triangle',.06,-320),

function clearTimers(){if(G)for(const t of G.timers)clearTimeout(t)}

function banner(text,sub,col,dur){if(G.demo)return;G.banner={text,sub:sub||'',col:col||PAL.chalk,t:dur||1.2,d:dur||1.2}}
function stallNum(){return G.stallT>0?Math.min(10,Math.floor(G.stallT/.85)+1):0}
const flatRange=t=>34+t*1.1;
const huckRange=t=>46+t*2.9;

function computeForce(){
  const y=G.anchor.y;
  G.os=Math.abs(y-20)<6?(Math.random()<.5?1:-1):(y<20?-1:1);
  G.markAng=Math.atan2(-G.os,.35);

function assignSlots(){

  const handlers=G.off.filter(e=>e.idx!==h&&e.p.pos==='H');
  const cutters=G.off.filter(e=>e.idx!==h&&e.p.pos!=='H');
  handlers.forEach((e,i)=>{if(i<2){e.slot=i;e.lane='H'}else{cutters.unshift(e)}});
  cutters.forEach((e,i)=>{e.slot=i;e.lane='C'});
}
function slotPos(e){

  if(e.lane==='H'){
    if(e.slot===0)return[clamp(a.x-4.5,.5,108),clamp(a.y-os*5,2,38)];

function setupPossession(x,y,label){
  G.flight=null;

  }
  for(const d of G.def){

  G.phase='ready';G.readyT=1.0;G.stallT=0;G.markerSet=false;G.settle=0;G.cutTimer=.5;G.resetCut=false;G.fake=0;

// ---------------------------------------------------------------- AI movement
function steer(e,tx,ty,mul,dt){
  const max=e.speed*mul;let dx=tx-e.x,dy=ty-e.y;const L=Math.hypot(dx,dy);
  let dvx=0,dvy=0;
  if(L>.12){const s=Math.min(max,L*4);dvx=dx/L*s;dvy=dy/L*s}
  const a=30*dt;
  e.vx+=clamp(dvx-e.vx,-a,a);e.vy+=clamp(dvy-e.vy,-a,a);
}
function integrate(e,dt){
  e.x=clamp(e.x+e.vx*dt,-3,FL+3);e.y=clamp(e.y+e.vy*dt,-2.5,FW+2.5);
  e.anim+=Math.hypot(e.vx,e.vy)*dt;
  if(Math.abs(e.vx)>.5)e.face=e.vx>0?1:-1;
}
function histAt(o,t){
  const h=o.hist;if(!h.length)return{x:o.x,y:o.y};
  for(let i=h.length-1;i>=0;i--)if(h[i][0]<=t)return{x:h[i][1],y:h[i][2]};
  return{x:h[0][1],y:h[0][2]};
}
function guardSteer(d,o,dt){
  const lag=clamp(.2+(5.5-d.p.def)*.018+d.bite,.08,.75);
  const hp=histAt(o,G.t-lag);
  steer(d,hp.x+.75,hp.y,1,dt);
  if(Math.abs(d.vx)<.5)d.face=o.x>d.x?1:-1;
}
function markSteer(d,dt){
  const h=G.holder>=0?G.off[G.holder]:null;
  if(!h){guardSteer(d,G.off[d.idx],dt);return}
  const ang=G.fake>0?Math.atan2(G.os*.9,.5):G.markAng;
  const mx=h.x+Math.cos(ang)*1.2,my=h.y+Math.sin(ang)*1.2;
  steer(d,mx,my,1.15,dt);
  if(dist(d.x,d.y,mx,my)<1.8)G.markerSet=true;
  d.face=h.x>d.x?1:-1;
}
function updateOff(e,dt,ph){
  if(e.idx===G.holder){const k=Math.exp(-10*dt);e.vx*=k;e.vy*=k;return}
  if(ph==='ready'){const[tx,ty]=slotPos(e);steer(e,tx,ty,.5,dt);return}
  switch(e.state){
    case'chase':steer(e,e.tx,e.ty,1.1,dt);break;
    case'cut':steer(e,e.tx,e.ty,1,dt);e.timer-=dt;
      if(e.timer<=0||dist(e.x,e.y,e.tx,e.ty)<.8){e.state='clear';e.timer=1.4}break;
    case'clear':{const[tx,ty]=slotPos(e);steer(e,tx,ty,.75,dt);e.timer-=dt;
      if(e.timer<=0||dist(e.x,e.y,tx,ty)<1)e.state=e.lane==='H'?'handler':'stack';break}
    default:{const[tx,ty]=slotPos(e);steer(e,tx,ty,.6,dt)}
  }
}
function updateDef(d,dt,ph){
  const o=G.off[d.idx];
  if(d.state==='mark')markSteer(d,dt);
  else if(ph==='ready')steer(d,o.x+1,o.y,.6,dt);
  else if(d.state==='chase'){d.chaseDelay-=dt;if(d.chaseDelay<=0)steer(d,d.tx,d.ty,1.04,dt);else guardSteer(d,o,dt)}
  else guardSteer(d,o,dt);
  if(d.bite>0)d.bite=Math.max(0,d.bite-dt*.35);
}
function scheduleCut(){
  const cands=G.off.filter(e=>e.idx!==G.holder&&e.lane==='C'&&e.state==='stack');
  const cutting=G.off.filter(e=>e.state==='cut').length;
  if(!cands.length||cutting>=2)return;
  const e=wpick(cands,c=>c.isMe?2.5:1);
  const a=G.anchor,os=G.os;
  const under=e.slot<=1?Math.random()<.7:Math.random()<.35;
  if(under){
    const room=os>0?38-a.y:a.y-2;
    let ty;
    if(room<4||Math.random()<.15)ty=a.y-os*rand(6,12);else ty=a.y+os*rand(4,Math.min(13,room));
    e.tx=clamp(a.x+rand(5,13),.5,107);e.ty=clamp(ty,1.5,38.5);e.timer=1.5;
  }else{
    e.tx=clamp(a.x+rand(24,42),a.x+12,107.5);e.ty=clamp(lerp(20,a.y,.3)+os*rand(-4,12),2.5,37.5);e.timer=2.4;
  }
  e.state='cut';
  const d=G.def[e.idx];d.bite=rand(0,.32)*clamp(1+(e.p.spd-d.p.spd)*.15,.3,1.8);
}
function chooseReceiver(tx,ty,ex=G.holder){
  let best=null,bt=1e9;
  for(const e of G.off){if(e.idx===ex)continue;const t=dist(e.x,e.y,tx,ty)/e.speed;if(t<bt){bt=t;best=e}}
  return best;
}

// ---------------------------------------------------------------- throwing
function pivotFake(){
  if(!G||G.phase!=='live'||G.fakeCd>0)return;
  G.fake=.65;G.fakeCd=1.4;beep(240,.05,'square',.03);
}
function throwDisc(type,ax,ay,ai){
  if(!G||G.phase!=='live'||G.settle>0||G.holder<0)return false;
  if(G.demo&&!ai)return false;
  const h=G.off[G.holder],thr=h.p.thr;
  let dx=ax-h.x,dy=ay-h.y,d=Math.hypot(dx,dy);
  if(d<2.5)return false;
  const maxR=type==='flat'?flatRange(thr):huckRange(thr);
  if(d>maxR){dx*=maxR/d;dy*=maxR/d;d=maxR}
  let tx=h.x+dx,ty=h.y+dy;
  let err=d*(type==='flat'?(.06-thr*.0042):(.095-thr*.006));if(stallNum()>=8)err*=1.6;
  const ea=Math.random()*Math.PI*2,er=err*Math.sqrt(Math.random())*1.2;
  tx+=Math.cos(ea)*er;ty+=Math.sin(ea)*er;
  const sp=type==='flat'?19+thr*.9:14+thr*.55;
  const T=d/sp+(type==='huck'?.35:0);
  if(type==='huck'){tx+=G.wind.x*T*.3;ty+=G.wind.y*T*.3}
  const ang=Math.atan2(ty-h.y,tx-h.x);
  const thrower=G.holder;
  type==='huck'?SFX.huck():SFX.throw();
  h.face=tx>=h.x?1:-1;
  if(Math.abs(angDiff(ang,G.markAng))<.8&&G.markerSet&&d>3){
    const pb=clamp(.5-thr*.035,.1,.5)*(G.fake>0?.2:1)*(type==='huck'?1.2:1);
    if(Math.random()<pb){
      G.holder=-1;G.disc.x=h.x+Math.cos(ang)*1.5;G.disc.y=h.y+Math.sin(ang)*1.5;G.disc.z=0;
      turnover({label:'HANDBLOCK',x:G.disc.x,y:G.disc.y,by:G.def[thrower],kind:'block',thrower:h});
      return true;
    }
  }
  const L=Math.hypot(tx-h.x,ty-h.y)||1;
  G.flight={type,fx:h.x,fy:h.y,tx,ty,t:0,T,dist:L,ux:(tx-h.x)/L,uy:(ty-h.y)/L,apex:type==='huck'?2.5+L*.11:0,touched:new Set(),thrower};
  G.holder=-1;G.phase='flight';
  h.state='clear';h.timer=1;
  const rcv=chooseReceiver(tx,ty,thrower);
  if(rcv){
    rcv.state='chase';rcv.tx=clamp(tx,-1,FL+1);rcv.ty=clamp(ty,-1,FW+1);
    const dd=G.def[rcv.idx];dd.state='chase';dd.tx=tx;dd.ty=ty;dd.chaseDelay=clamp(.34-dd.p.def*.018,.12,.32)+dd.bite;
  }
  if(type==='huck'){
    let help=null,hd=20;
    for(const dd of G.def){if(dd.state==='chase'||dd.idx===thrower)continue;const q=dist(dd.x,dd.y,tx,ty);if(q<hd){hd=q;help=dd}}
    if(help){help.state='chase';help.tx=tx;help.ty=ty;help.chaseDelay=.5}
  }
  G.def[thrower].state='guard';
  return true;
}
function updateFlight(dt){
  const f=G.flight;f.t+=dt;const s=f.t/f.T;
  let x,y,z,late=false;
  if(s<=1){
    x=lerp(f.fx,f.tx,s);y=lerp(f.fy,f.ty,s);
    z=f.type==='huck'?lerp(1.5,1,s)+4*f.apex*s*(1-s):lerp(1.4,1,s);
  }else{
    const ex=f.t-f.T,sp=f.dist/f.T;
    x=f.tx+f.ux*sp*.55*ex;y=f.ty+f.uy*sp*.55*ex;z=1-ex*(f.type==='huck'?3.2:2.6);late=true;
  }
  G.disc.x=x;G.disc.y=y;G.disc.z=Math.max(0,z);
  if(z<=0){
    const out=x<0||x>FL||y<0||y>FW;
    turnover({label:out?'OUT':'TURF',x,y,kind:out?'out':'turf',f});return;
  }
  if(f.t<.12)return;
  const contacts=[];
  for(const e of G.off){
    if(e.idx===f.thrower||f.touched.has(e))continue;
    if(z>1.9+e.p.jmp*.09)continue;
    const r=1.15+e.p.hnd*.03+(late?.65:0),dd=dist(e.x,e.y,x,y);
    if(dd<r)contacts.push({e,dd});
  }
  for(const e of G.def){
    if(f.touched.has(e))continue;
    if(e.idx===f.thrower&&f.t<.3)continue;
    if(z>1.95+e.p.jmp*.09)continue;
    const r=.68+e.p.def*.035+(late?.4:0),dd=dist(e.x,e.y,x,y);
    if(dd<r)contacts.push({e,dd});
  }
  if(!contacts.length)return;
  contacts.sort((a,b)=>a.dd-b.dd);
  const offC=contacts.find(c=>c.e.side==='off'),defC=contacts.find(c=>c.e.side==='def');
  const thrP=G.off[f.thrower].p;
  if(offC&&defC&&f.type==='huck'){
    const o=offC.e.p,d=defC.e.p;
    const pO=clamp(.5+(o.jmp-d.jmp)*.07+(o.hnd-5)*.02+(defC.dd-offC.dd)*.15,.15,.85);
    if(Math.random()<pO)doCatch(offC.e,f,'SKYED!');
    else turnover({label:'SKYED!',x,y,by:defC.e,kind:'d',f});
    return;
  }
  const c=contacts[0];f.touched.add(c.e);
  if(c.e.side==='def'){
    const pD=clamp(.2+c.e.p.def*.04-thrP.thr*.015+(late?-.08:0),.1,.65);
    if(Math.random()<pD)turnover({label:late?'LAYOUT D':'D!',x,y,by:c.e,kind:'d',f});
  }else{
    const contested=G.def.some(d=>dist(d.x,d.y,x,y)<1.6);
    let pc=.9+c.e.p.hnd*.01-(late?.2:0)-(contested?.1:0)-(f.type==='huck'?.04:0);
    pc=clamp(pc,.35,.985);
    if(Math.random()<pc)doCatch(c.e,f,late?'LAYOUT!':null);
    else turnover({label:'DROP',x,y,kind:'drop',recv:c.e,f});
  }
}
function resetChases(){
  for(const o of G.off)if(o.state==='chase'){o.state='clear';o.timer=1.2}
  for(const d of G.def)if(d.state==='chase')d.state='guard';
}
function doCatch(e,f,label){
  const thrEnt=G.off[f.thrower];
  G.flight=null;resetChases();
  if(e.y<0||e.y>FW||e.x>FL||e.x<0){turnover({label:'OUT',x:clamp(e.x,0,FL),y:clamp(e.y,0,FW),kind:'out',f,recv:e});return}
  SFX.catch();
  if(!G.demo){G.stats[thrEnt.p.id].c++;G.stats[e.p.id].ct++}
  if(e.x>=90){goal(e,thrEnt);return}
  if(label)banner(label,'',PAL.gold,.9);
  G.holder=e.idx;e.state='holder';e.vx*=.35;e.vy*=.35;
  G.anchor={x:e.x,y:e.y};
  G.phase='live';G.settle=.28;G.stallT=0;G.markerSet=false;G.resetCut=false;G.fake=0;
  computeForce();assignSlots();
  for(const d of G.def)d.state=d.idx===e.idx?'mark':'guard';
}
function goal(e,thrEnt){
  G.holder=e.idx;e.state='holder';G.flight=null;
  if(G.demo){banner('POINT!',`${e.p.last} from ${thrEnt.p.last}`,PAL.gold,1.6);G.phase='dead';G.deadT=1.8;G.after=()=>setupPossession(rand(20,40),rand(8,32),'');return}
  G.score[0]++;G.stats[e.p.id].g++;G.stats[thrEnt.p.id].a++;
  SFX.score();
  banner('POINT!',`${pname(e.p)} from ${pname(thrEnt.p)}`,PAL.gold,1.8);
  G.phase='dead';G.deadT=2.0;G.after=()=>{G.nextReceiver=1;afterPoint()};
}
function turnover(o){
  const subs={d:o.by?`${pname(o.by.p)} gets the block`:'',block:o.by?`Point-block by ${tag(o.by.p)}`:'',drop:o.recv?`${o.recv.p.last} drops it`:'',turf:'Throwaway',out:'Out of bounds',stall:o.by?`Stall ten. ${o.by.p.last} on the mark`:'Stall ten'};
  SFX.turn();G.lastTO=o.label;G.toCount=(G.toCount||0)+1;
  banner(o.label,subs[o.kind]||'',PAL.red,1.4);
  if(!G.demo){
    const st=G.stats;
    if(o.kind==='drop'&&o.recv)st[o.recv.p.id].to++;
    else if(o.thrower)st[o.thrower.p.id].to++;
    else if(o.f)st[G.off[o.f.thrower].p.id].to++;
  }
  G.flight=null;G.holder=-1;G.disc.x=o.x;G.disc.y=o.y;G.disc.z=0;resetChases();
  G.phase='dead';G.deadT=1.5;
  const x=o.x;
  G.after=G.demo?()=>setupPossession(rand(22,40),rand(8,32),''):()=>startDefense(clamp(x,20,90),false);
}
function stallOut(){
  const h=G.off[G.holder];
  turnover({label:'STALL',x:h.x,y:h.y,by:G.def[h.idx],kind:'stall',thrower:h});
}

// ---------------------------------------------------------------- per-frame logic
function liveLogic(dt){
  if(G.settle>0)G.settle-=dt;
  if(G.markerSet&&G.settle<=0){
    const before=stallNum();G.stallT+=dt;const n=stallNum();
    if(n!==before&&!G.demo&&n>1)SFX.stall(n);
    if(G.stallT>=9*.85+.4){stallOut();return}
  }
  G.cutTimer-=dt;
  if(G.cutTimer<=0){scheduleCut();G.cutTimer=rand(.8,1.5)}
  if(!G.resetCut&&stallNum()>=6){
    G.resetCut=true;
    const dump=G.off.find(e=>e.lane==='H'&&e.slot===0&&e.idx!==G.holder);
    if(dump){dump.state='cut';dump.timer=1.3;dump.tx=clamp(G.anchor.x+rand(1,4),.5,107);dump.ty=clamp(G.anchor.y+G.os*rand(3,6),1.5,38.5)}
  }
  if(G.demo&&G.settle<=0){
    G.demoTimer-=dt;
    if(G.demoTimer<=0){
      const h=G.off[G.holder];let best=null,bs=-1e9;
      for(const e of G.off){
        if(e.idx===G.holder)continue;
        const d=G.def[e.idx],sep=dist(e.x,e.y,d.x,d.y),dd=dist(e.x,e.y,h.x,h.y);
        if(dd>45)continue;
        const sc=sep*1.5+(e.x-h.x)*.08+(e.state==='cut'?1:0);
        if(sc>bs){bs=sc;best=e}
      }
      if(best){const ax=best.x+best.vx*.55,ay=best.y+best.vy*.55;throwDisc(dist(ax,ay,h.x,h.y)>30?'huck':'flat',ax,ay,true)}
      G.demoTimer=rand(.9,1.8);
    }
  }
}
function update(dt){
  G.t+=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
  if(G.rain)for(const r of G.rainDrops){r.y+=r.s*dt;r.x-=r.s*.25*dt;if(r.y>H){r.y=-10;r.x=Math.random()*(W+120)}}
  const ph=G.phase;
  if(G.fake>0)G.fake-=dt;if(G.fakeCd>0)G.fakeCd-=dt;
  if(ph==='ready'){G.readyT-=dt;if(G.readyT<=0)G.phase='live'}
  if(ph==='ready'||ph==='live'||ph==='flight'||ph==='dead'){
    for(const o of G.off){o.hist.push([G.t,o.x,o.y]);while(o.hist.length>2&&o.hist[0][0]<G.t-1.2)o.hist.shift()}
    if(ph==='live')liveLogic(dt);
    for(const o of G.off)updateOff(o,dt,G.phase);
    for(const d of G.def)updateDef(d,dt,G.phase);
    for(const e of G.off)integrate(e,dt);
    for(const e of G.def)integrate(e,dt);
    if(G.phase==='flight')updateFlight(dt);
    if(G.holder>=0){
      const h=G.off[G.holder];
      if(G.phase==='live'&&!G.demo&&input.in){const w=mouseWorld();h.face=w.x>=h.x?1:-1}
      G.disc.x=h.x+h.face*.55;G.disc.y=h.y;G.disc.z=1.1;
    }
  }
  if(ph==='dead'){G.deadT-=dt;if(G.deadT<=0){G.phase='wait';const f=G.after;G.after=null;f&&f()}}
  const tx=clamp(G.phase==='flight'?G.disc.x-30:G.disc.x-16,-4,FL+4-VIEW);
  G.camX+=(tx-G.camX)*Math.min(1,dt*2.5);
}

// ---------------------------------------------------------------- defense (simulated, like the other side of the ball in classic arcade football)
function startDefense(x,fromPull){
  if(G.demo)return;
  G.phase='defense';G.holder=-1;
  const yds=Math.round(x-20);
  const T=G.opp.team;
  const where=fromPull?`${esc(T.name)} receives your pull.`:`${esc(T.name)} picks up the disc ${yds} yards from the end zone they attack.`;
  const zoneNote=G.wind.mph>=10?`Strong in this wind (${G.wind.mph} mph).`:`Better when the wind is up. Today: ${G.wind.mph} mph.`;
  ui.innerHTML=`<div class="screen"><div class="panel dpanel">
    <div class="eyebrow">Defense · ${G.score[0]}–${G.score[1]}</div>
    <h2>Call the D</h2>
    <p class="dim">${where} Your line plays it out. Pick the look.</p>
    <div class="choices" id="dchoices">
      <button class="choice" data-key="1" data-s="person"><b><span class="kbd">1</span> Person D</b><span>Everyone takes a mark and grinds. Steady against any offense.</span></button>
      <button class="choice" data-key="2" data-s="zone"><b><span class="kbd">2</span> Zone</b><span>A cup traps the thrower. ${zoneNote} Weak against good throwers.</span></button>
    </div>
    <div class="ticker" id="ticker" hidden></div>
    <div class="row end" id="dfoot"></div>
  </div></div>`;
  ui.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{SFX.click();runDefense(x,fromPull,b.dataset.s)}));
  ui.querySelector('.choice').focus();
}
function simDefense(startX,fromPull,scheme){
  const oR=G.opp.ro,mR=G.me.ro;
  const oOff=teamOff(oR),mDef=teamDef(mR),oThr=avg(oR.map(p=>p.thr));
  let p=.5+(oOff-mDef)*.075+(1-(startX-20)/70)*.2;
  if(scheme==='zone')p+=(oThr-5.5)*.05-(G.wind.mph-7)*.014;
  p=clamp(p,.12,.9);
  const scored=Math.random()<p;
  const T=G.opp.team.name;
  const byO=a=>wpick(a,q=>Math.pow(ovr(q),2.2));
  const handlers=oR.filter(q=>q.pos==='H');
  const A=byO(handlers),B=byO(oR.filter(q=>q!==A));
  const lines=[];
  lines.push(fromPull?`${T} catches the pull and walks it up.`:`${T} checks it in.`);
  const mids=[`${tag(A)} swings it to ${tag(B)}.`,`Under cut. ${tag(B)} is open for 10.`,`${tag(A)} breaks the mark to ${tag(B)}.`,`Dump, swing. ${T} resets the stall.`,`${tag(B)} hits the give-go.`];
  shuffle(mids);
  for(let i=0;i<randi(1,2);i++)lines.push(mids[i]);
  const res={scored,lines,dX:20,dPlayer:null};
  if(scored){
    const scorer=byO(oR.filter(q=>q.pos!=='H').concat(oR)),assist=byO(oR.filter(q=>q!==scorer));
    lines.push(pick([`${tag(assist)} hucks it deep...`,`${tag(assist)} looks up the line...`,`${tag(assist)} flips a hammer over the top...`]));
    lines.push({t:`${tag(scorer)} in the end zone. Point ${T}.`,c:'bad big'});
  }else{
    const r=Math.random();
    const myD=wpick(mR,q=>Math.pow(q.def,2)*(q.id===G.meId?1.6:1));
    const from=byO(oR),to=byO(oR.filter(q=>q!==from));
    res.dX=clamp(lerp(startX,20,rand(.1,.85)),20,88);
    if(r<.55){
      lines.push(`${tag(from)} throws to ${tag(to)}...`);
      lines.push({t:`BLOCKED! ${pname(myD)} gets the D.`,c:'good big'});res.dPlayer=myD;
    }else if(r<.8){
      lines.push(`${tag(from)} puts up a huck...`);
      lines.push({t:scheme==='zone'?'It dies in the wind. Turnover!':'Too long. It sails out the back. Turnover!',c:'good big'});
      res.dX=20;
    }else{
      lines.push(`Stall 7... 8... 9...`);
      lines.push({t:`STALLED! ${pname(myD)} on the mark.`,c:'good big'});res.dPlayer=myD;
    }
  }
  return res;
}
function runDefense(x,fromPull,scheme){
  const res=simDefense(x,fromPull,scheme);
  document.getElementById('dchoices').hidden=true;
  const tk=document.getElementById('ticker');tk.hidden=false;
  let i=0;
  const step=()=>{
    if(i>=res.lines.length){
      res.scored?SFX.turn():SFX.score();
      const foot=document.getElementById('dfoot');if(!foot)return;
      foot.innerHTML=`<button class="btn" data-primary>${res.scored?'Receive the pull':'Take it the other way'} <span class="kbd">Enter</span></button>`;
      foot.querySelector('button').addEventListener('click',()=>finishDefense(res));
      foot.querySelector('button').focus();
      return;
    }
    const l=res.lines[i++];const pEl=document.createElement('p');
    if(typeof l==='string')pEl.textContent=l;else{pEl.textContent=l.t;pEl.className=l.c}
    tk.appendChild(pEl);beep(500+i*60,.03,'square',.02);
    later(step,i===res.lines.length?800:650);
  };
  later(step,250);
}
function finishDefense(res){
  ui.innerHTML='';
  if(res.scored){G.score[1]++;G.nextReceiver=0;afterPoint()}
  else{
    if(res.dPlayer&&G.stats[res.dPlayer.id])G.stats[res.dPlayer.id].d++;
    setupPossession(res.dX,rand(6,34),'YOUR DISC');
  }
}
function afterPoint(){
  const t=G.target;
  if(G.score[0]>=t||G.score[1]>=t){endMatch();return}
  if(!G.halfDone&&Math.max(G.score[0],G.score[1])>=Math.ceil(t/2)){
    G.halfDone=true;G.nextReceiver=1-G.firstReceiver;G.phase='wait';SFX.whistle();
    ui.innerHTML=`<div class="screen"><div class="panel" style="align-items:center;text-align:center">
      <div class="eyebrow">Halftime</div><h2>${esc(G.me.team.abbr)} ${G.score[0]} – ${G.score[1]} ${esc(G.opp.team.abbr)}</h2>
      <p class="dim">Orange slices on the sideline. ${G.nextReceiver===0?'You receive to start the second half.':esc(G.opp.team.name)+' receives to start the second half.'}</p>
      <div class="row"><button class="btn" data-primary>Second half <span class="kbd">Enter</span></button></div></div></div>`;
    const b=ui.querySelector('[data-primary]');b.focus();
    b.addEventListener('click',()=>{ui.innerHTML='';nextPoint()});
    return;
  }
  nextPoint();
}
function endMatch(){
  G.phase='over';SFX.whistle();
  const win=G.score[0]>G.score[1];
  banner('FINAL',`${G.me.team.abbr} ${G.score[0]} – ${G.score[1]} ${G.opp.team.abbr}`,win?PAL.gold:PAL.red,3);
  const res={us:G.score[0],them:G.score[1],win,stats:G.stats};
  later(()=>{G.onEnd&&G.onEnd(res)},1600);
}
function togglePause(){
  if(!G||G.demo)return;
  if(G.paused){G.paused=false;ui.innerHTML='';return}
  if(ui.firstElementChild)return;
  G.paused=true;
  ui.innerHTML=`<div class="screen"><div class="panel" style="align-items:stretch;min-width:calc(var(--u)*320)">
    <div class="eyebrow">Paused</div><h2>${esc(G.me.team.abbr)} ${G.score[0]} – ${G.score[1]} ${esc(G.opp.team.abbr)}</h2>
    <button class="btn" data-primary id="resume">Resume <span class="kbd">Esc</span></button>
    <button class="btn alt" id="phow">How to play</button>
    <button class="btn alt" id="pquit">${G.career?'Forfeit and return to career':'Quit to title'}</button></div></div>`;
  document.getElementById('resume').addEventListener('click',togglePause);
  document.getElementById('phow').addEventListener('click',()=>showHow(()=>{G.paused=false;togglePause()}));
  document.getElementById('pquit').addEventListener('click',()=>{
    if(G.career){G.phase='over';const res={us:G.score[0],them:Math.max(G.target,G.score[1]),win:false,stats:G.stats,forfeit:true};G.paused=false;clearTimers();G.onEnd&&G.onEnd(res)}
    else{clearTimers();showTitle()}
  });
  document.getElementById('resume').focus();
}

const sy=y=>Math.round(FT+y*SQ);

function drawPlayer(e,col){

function drawDisc(){
  const d=G.disc,X=sx(d.x),Y=sy(d.y);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(X-4,Y-1,8,3);

  if(G.flight){const sp=Math.floor(G.t*30)%2;rect(X-3+sp*4,Z,2,1,'#c6c2b2')}
}
function drawGroundLayer(){
  if(!(G.phase==='live'||G.phase==='ready')||G.demo)return;
  for(const e of G.off){
    if(e.idx===G.holder)continue;
    const d=G.def[e.idx],sep=dist(e.x,e.y,d.x,d.y);
    const c=sep>=3.2?PAL.sea:sep>=1.8?PAL.gold:PAL.red;
    const X=sx(e.x),Y=sy(e.y);
    ctx.globalAlpha=.9;
    rect(X-9,Y-1,18,2,c);rect(X-11,Y+1,3,2,c);rect(X+8,Y+1,3,2,c);rect(X-9,Y+3,18,2,c);
    ctx.globalAlpha=1;
  }
  // mark wedge
  if(G.holder>=0&&G.markerSet&&G.phase==='live'){
    const h=G.off[G.holder];
    ctx.beginPath();ctx.moveTo(sx(h.x),sy(h.y));
    for(let a=-.8;a<=.8001;a+=.1){const A=G.markAng+a;ctx.lineTo(sx(h.x+Math.cos(A)*5),sy(h.y+Math.sin(A)*5))}
    ctx.closePath();
    ctx.fillStyle=G.fake>0?'rgba(255,107,93,.07)':'rgba(255,107,93,.24)';ctx.fill();
    ctx.strokeStyle=G.fake>0?'rgba(255,107,93,.25)':'rgba(255,107,93,.7)';ctx.lineWidth=1;ctx.stroke();
  }
}
function drawAim(){
  if(G.phase!=='live'||G.demo||G.holder<0||!input.in||G.paused||ui.firstElementChild)return;
  const h=G.off[G.holder],w=mouseWorld(),huck=input.shift;
  let dx=w.x-h.x,dy=w.y-h.y,d=Math.hypot(dx,dy);
  const maxR=huck?huckRange(h.p.thr):flatRange(h.p.thr),over=d>maxR;
  if(over){dx*=maxR/d;dy*=maxR/d;d=maxR}
  const tx=h.x+dx,ty=h.y+dy;
  const inW=Math.abs(angDiff(Math.atan2(dy,dx),G.markAng))<.8&&G.fake<=0;
  const c=over?PAL.red:inW?PAL.sunset:PAL.chalk;
  const apex=2.5+d*.11;
  for(let s=.06;s<1;s+=huck?.04:.05){
    const x=lerp(h.x,tx,s),y=lerp(h.y,ty,s),z=huck?lerp(1.5,1,s)+4*apex*s*(1-s):1.2;
    rect(sx(x)-1,sy(y)-Math.round(z*ZH)-6,2,2,c);
  }
  const X=sx(tx),Y=sy(ty);
  rect(X-8,Y,5,2,c);rect(X+4,Y,5,2,c);rect(X,Y-6,2,4,c);rect(X,Y+3,2,4,c);
  ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(X+1,Y+1,9,5,0,0,Math.PI*2);ctx.stroke();
  text(`${huck?'HUCK':'FLAT'} ${Math.round(d)}YD`,X+14,Y-6,10,c,'left');
  if(inW)text('INTO THE MARK',X+14,Y+8,9,PAL.sunset,'left');
  const r=chooseReceiver(tx,ty);
  if(r){const RX=sx(r.x),RY=sy(r.y)-13*P-14;rect(RX-4,RY,9,2,PAL.chalk);rect(RX-2,RY+2,5,2,PAL.chalk);rect(RX,RY+4,1,2,PAL.chalk)}
}

function startCareer(info,teamId){
  const me=Object.assign({id:'me',first:info.first.slice(0,14),last:info.last.slice(0,16),num:info.num,pos:info.pos,skin:randi(0,4),hair:randi(0,6),style:randi(0,2),grade:9},START[info.pos]);
  const rosters={},prestige={};
  for(const t of TEAMS){
    prestige[t.id]=t.elite?5:randi(1,5);
    const ro=genRoster(Math.random,prestige[t.id],t.elite);
    if(t.id===teamId){
      // you take a roster spot: drop a non-star with your position (or any non-star)
      let i=ro.findIndex(p=>p.pos===info.pos&&starsOf(p)<4);if(i<0)i=ro.findIndex(p=>starsOf(p)<4);if(i<0)i=6;
      ro.splice(i,1);
      ro.forEach(p=>{if(p.num===me.num)p.num=(p.num+11)%100});
    }
    rosters[t.id]=ro;
  }
  CAR={v:1,me,teamId,year:1,level:1,xp:0,sp:2,rosters,prestige,titles:0,history:[],totals:{gp:0,w:0,l:0,g:0,a:0,d:0,c:0,ct:0,to:0},awards:[]};
  newSeason();saveCareer();showHub();

function newSeason(){
  const my=TEAM(CAR.teamId);
  const others=shuffle(TEAMS.filter(t=>t.id!==CAR.teamId));
  const same=others.filter(t=>t.st===my.st),diff=others.filter(t=>t.st!==my.st);
  const nSame=Math.min(5,same.length);
  const opps=shuffle(same.slice(0,nSame).concat(diff.slice(0,8-nSame)));
  const EV={WA:['Rainy City Invite','Cascade Cup','Puget Sound Showdown'],OR:['Rose City Classic','Willamette Weekend','Track Town Classic'],CA:['Golden Gate Open','Bay Bash','Redwood Shootout']};
  CAR.season={schedule:opps.map((t,i)=>({opp:t.id,home:i%2===0,event:pick(EV[t.st]),res:null})),week:0,
    standings:Object.fromEntries(TEAMS.map(t=>[t.id,{w:0,l:0,pf:0,pa:0}])),phase:'reg',bracket:null,round:0,seeds:null,finish:null,champ:null,
    stats:{gp:0,w:0,l:0,g:0,a:0,d:0,c:0,ct:0,to:0},awards:[]};
}
function simScore(a,b){
  const ra=teamOvr(rosterOf(a))+(CAR.prestige[a]-3)*.1,rb=teamOvr(rosterOf(b))+(CAR.prestige[b]-3)*.1;
  const pa=1/(1+Math.exp(-(ra-rb)*1.6));
  const aw=Math.random()<pa;
  const lose=clamp(Math.round(4.5-Math.abs(ra-rb)*1.5+rand(-2.5,2)),0,6);
  return aw?[7,lose]:[lose,7];
}
function addStanding(a,b,sa,sb){
  const S=CAR.season.standings;
  S[a].pf+=sa;S[a].pa+=sb;S[b].pf+=sb;S[b].pa+=sa;
  if(sa>sb){S[a].w++;S[b].l++}else{S[b].w++;S[a].l++}
}
function simWeek(exclude){
  const ids=shuffle(TEAMS.map(t=>t.id).filter(id=>!exclude.includes(id)));
  for(let i=0;i+1<ids.length;i+=2){const[sa,sb]=simScore(ids[i],ids[i+1]);addStanding(ids[i],ids[i+1],sa,sb)}
}
function sortedStandings(){
  const S=CAR.season.standings;
  return TEAMS.map(t=>t.id).sort((a,b)=>(S[b].w-S[a].w)||((S[b].pf-S[b].pa)-(S[a].pf-S[a].pa))||(teamOvr(rosterOf(b))-teamOvr(rosterOf(a))));
}
function simMatch(m){const[sa,sb]=simScore(m.a,m.b);m.res=[sa,sb];m.win=sa>sb?m.a:m.b}
function buildNextRound(){
  const S=CAR.season,prev=S.bracket[S.round-1],w=prev.map(m=>m.win),next=[];
  for(let i=0;i<w.length;i+=2)next.push({a:w[i],b:w[i+1]});
  S.bracket.push(next);
}
function finishBracket(){
  const S=CAR.season;
  while(true){
    const r=S.bracket[S.round];
    for(const m of r)if(!m.win)simMatch(m);
    if(r.length===1){S.champ=r[0].win;break}
    S.round++;buildNextRound();
  }
}
function startPlayoffs(){
  const S=CAR.season;
  S.seeds=sortedStandings().slice(0,8);
  const s=S.seeds;
  S.bracket=[[{a:s[0],b:s[7]},{a:s[3],b:s[4]},{a:s[1],b:s[6]},{a:s[2],b:s[5]}]];S.round=0;
  if(!s.includes(CAR.teamId)){S.phase='done';S.finish='Missed the Pacific Championships';finishBracket();endSeasonAwards()}
  else S.phase='po';
}
function nextGame(){
  const S=CAR.season;
  if(S.phase==='reg'){const g=S.schedule[S.week];return{opp:g.opp,home:g.home,label:`Week ${S.week+1} of ${S.schedule.length} · ${g.event}`,kind:'reg'}}
  if(S.phase==='po'){
    const m=S.bracket[S.round].find(m=>m.a===CAR.teamId||m.b===CAR.teamId);
    const opp=m.a===CAR.teamId?m.b:m.a;
    return{opp,home:S.seeds.indexOf(CAR.teamId)<S.seeds.indexOf(opp),label:`Pacific Championships · ${['Quarterfinal','Semifinal','Final'][S.round]}`,kind:'po',m};
  }
  return null;
}
function endSeasonAwards(){
  const S=CAR.season,st=S.stats,o=ovr(CAR.me),pg=st.gp?(st.g+st.a+st.d)/st.gp:0;
  const aw=[];
  if(S.champ===CAR.teamId)aw.push('Pacific Champions');
  if(o>=8.4&&st.gp&&st.w/st.gp>=.7)aw.push('Pacific Player of the Year');
  if(o>=7.2||pg>=3)aw.push('All-Pacific First Team');
  else if(o>=6||pg>=2)aw.push('All-Pacific Second Team');
  S.awards=aw;CAR.awards=CAR.awards.concat(aw.map(a=>`${a} (${GRADE[CAR.me.grade]})`));
  CAR.history.push({year:CAR.year,grade:GRADE[CAR.me.grade],w:st.w,l:st.l,finish:S.finish,g:st.g,a:st.a,d:st.d,champ:TEAM(S.champ).name});
}
function careerGameEnd(res){
  const S=CAR.season,ng=nextGame(),s=res.stats.me||{g:0,a:0,d:0,c:0,ct:0,to:0};
  for(const k of['g','a','d','c','ct','to']){S.stats[k]+=s[k];CAR.totals[k]+=s[k]}
  S.stats.gp++;CAR.totals.gp++;
  if(res.win){S.stats.w++;CAR.totals.w++}else{S.stats.l++;CAR.totals.l++}
  // XP
  const lines=[];const add=(l,v)=>{if(v>0)lines.push([l,v])};
  if(!res.forfeit){
    add(res.win?'Win':'Played the game',res.win?50:25);
    add(`Goals × ${s.g}`,s.g*14);add(`Assists × ${s.a}`,s.a*14);add(`Blocks × ${s.d}`,s.d*12);
    add(`Catches × ${s.ct}`,s.ct*2);add(`Completions × ${s.c}`,s.c*2);
    if(ng.kind==='po')add('Playoff game',20);
  }
  const total=lines.reduce((t,l)=>t+l[1],0);
  CAR.xp+=total;let ups=0;
  while(CAR.xp>=xpNeed(CAR.level)){CAR.xp-=xpNeed(CAR.level);CAR.level++;CAR.sp+=3;ups++}
  // results
  if(ng.kind==='reg'){
    S.schedule[S.week].res=[res.us,res.them];addStanding(CAR.teamId,ng.opp,res.us,res.them);simWeek([CAR.teamId,ng.opp]);S.week++;
    if(S.week>=S.schedule.length)startPlayoffs();
  }else{
    const r=S.bracket[S.round],m=ng.m;
    m.res=m.a===CAR.teamId?[res.us,res.them]:[res.them,res.us];m.win=res.win?CAR.teamId:ng.opp;
    for(const mm of r)if(!mm.win)simMatch(mm);
    if(!res.win){S.finish=['Lost in the quarterfinal','Lost in the semifinal','Runner-up'][S.round];S.phase='done';finishBracket();endSeasonAwards()}
    else if(S.round===2){S.finish='Pacific Champions';S.champ=CAR.teamId;S.phase='done';CAR.titles++;endSeasonAwards()}
    else{S.round++;buildNextRound()}
  }
  saveCareer();
  if(ups)SFX.level();
  const me=TEAM(CAR.teamId),op=TEAM(ng.opp);
  show(`<div class="screen"><div class="panel" style="width:calc(var(--u)*760)">
    <div class="eyebrow">${esc(ng.label)}</div>
    <h2 class="${res.win?'gold':'bad'}">${res.forfeit?'Forfeit':res.win?'Win':'Loss'} · ${esc(me.abbr)} ${res.us}–${res.them} ${esc(op.abbr)}</h2>
    <div class="two">
      <div>${boxScore(res,myRoster())}</div>
      <div class="card">
        <h3>Your game</h3>
        <div>${s.g} goals · ${s.a} assists · ${s.d} blocks · ${s.to} turnovers</div>
        <table><tbody>${lines.map(l=>`<tr><td>${esc(l[0])}</td><td class="n gold">+${l[1]} XP</td></tr>`).join('')||'<tr><td class="dim">No XP for a forfeit.</td></tr>'}</tbody></table>
        ${ups?`<div class="levelup">Level up! Now level ${CAR.level}. +${ups*3} skill points</div>`:''}
        <div class="dim">Level ${CAR.level}: ${CAR.xp} / ${xpNeed(CAR.level)} XP</div>
      </div>
    </div>
    <div class="row end"><button class="btn" id="tohub" data-primary>Back to the team <span class="kbd">Enter</span></button></div>
  </div></div>`);
  on('tohub',showHub);
}
function playCareerGame(){
  const ng=nextGame();
  const me={team:TEAM(CAR.teamId),ro:myRoster()},opp={team:TEAM(ng.opp),ro:rosterOf(ng.opp)};
  pregame({me,opp,home:ng.home,label:ng.label,meId:'me',career:true,onEnd:careerGameEnd,back:showHub});
}
function attrRows(){
  return ATTR.map(a=>{const v=CAR.me[a],c=upCost(v),can=v<10&&CAR.sp>=c;
    return`<div class="attr" title="${esc(ATTR_HINT[a])}"><span>${ATTR_NAME[a]}</span><div class="pips">${Array.from({length:10},(_,i)=>`<span class="${i<v?'on':''}"></span>`).join('')}</div><span class="v">${v}</span>
    <button class="plus" data-up="${a}" ${can?'':'disabled'} aria-label="Upgrade ${ATTR_NAME[a]} for ${c} skill points">${v>=10?'MAX':`+1 · ${c}SP`}</button></div>`}).join('');
}
function showHub(){
  if(!G||!G.demo)startDemo();
  const S=CAR.season,t=TEAM(CAR.teamId),me=CAR.me,ng=nextGame(),st=S.standings[CAR.teamId];
  const sched=S.schedule.map((g,i)=>{const o=TEAM(g.opp);const r=g.res?`<span class="${g.res[0]>g.res[1]?'good':'bad'}">${g.res[0]>g.res[1]?'W':'L'} ${g.res[0]}–${g.res[1]}</span>`:'<span class="dim">–</span>';
    return`<div class="${S.phase==='reg'&&i===S.week?'next':''}"><span>W${i+1}</span><span>${g.home?'vs':'at'} ${esc(o.name)}</span>${r}</div>`}).join('');
  const po=S.bracket?S.bracket.map((r,ri)=>r.map(m=>{const mine=m.a===CAR.teamId||m.b===CAR.teamId;const res=m.res?`${m.res[0]}–${m.res[1]}`:'';return`<div class="${mine&&!m.res?'next':''}"><span>${['QF','SF','F'][ri]}</span><span>${esc(TEAM(m.a).abbr)} vs ${esc(TEAM(m.b).abbr)}${m.win?` · <b class="${m.win===CAR.teamId?'good':''}">${esc(TEAM(m.win).abbr)}</b>`:''}</span><span class="dim">${res}</span></div>`}).join('')).join(''):'';
  const ranks=sortedStandings().slice(0,8).map((id,i)=>{const s=S.standings[id];return`<tr class="${id===CAR.teamId?'me':''}"><td>${i+1}</td><td class="trunc">${esc(TEAM(id).name)}</td><td class="n">${s.w}-${s.l}</td><td class="n">${s.pf-s.pa>0?'+':''}${s.pf-s.pa}</td></tr>`}).join('');
  let next;
  if(ng){const o=TEAM(ng.opp),oro=rosterOf(ng.opp);
    next=`<div class="nextbox"><div class="eyebrow">${esc(ng.label)}</div><div class="big">${ng.home?'vs':'at'} ${esc(o.name)}</div>
    <div class="dim">${esc(o.city)}, ${o.st} · OVR ${teamOvr(oro).toFixed(1)} · Top star: ${esc(pname(topStars(oro,1)[0]))}</div>
    <div class="row"><button class="btn" id="play" data-primary>Play game <span class="kbd">Enter</span></button></div></div>`;
  }else{
    const last=CAR.year>=4;
    next=`<div class="nextbox"><div class="eyebrow">Season ${CAR.year} complete</div><div class="big">${esc(S.finish||'')}</div>
    <div class="dim">Champion: ${esc(TEAM(S.champ).name)}. ${S.awards.length?'Your awards: '+S.awards.map(esc).join(', ')+'.':'No individual awards this year.'}</div>
    <div class="row"><button class="btn" id="nexts" data-primary>${last?'Graduate':'Start next season'} <span class="kbd">Enter</span></button></div></div>`;
  }
  show(`<div class="screen"><div class="panel hub">
    <div class="row between"><div><div class="eyebrow">Year ${CAR.year} of 4 · ${GRADE[me.grade]}</div><h2>${esc(t.name)}</h2><div class="dim">${esc(t.city)}, ${STATE_NAME[t.st]} · Record ${st.w}-${st.l}</div></div>
      <div class="row"><button class="btn alt small" id="roster">Roster</button><button class="btn alt small" id="quit">Save and exit</button></div></div>
    <div class="hub-grid">
      <section class="card">
        <div class="row between"><div class="me-name">${esc(pname(me))}</div><span class="badge">#${me.num} ${POS[me.pos].toUpperCase()}</span></div>
        <div class="row between"><span class="stars">${starStr(starsOf(me))}</span><span class="dim">OVR ${ovr(me).toFixed(1)}</span></div>
        <div class="row between"><span>Level ${CAR.level}</span><span class="dim">${CAR.xp} / ${xpNeed(CAR.level)} XP</span></div>
        <div class="xpbar"><i style="width:${Math.round(100*CAR.xp/xpNeed(CAR.level))}%"></i></div>
        <div class="row between"><span class="sp">${CAR.sp} skill points</span><span class="dim" style="font-size:calc(var(--u)*12)">Hover a stat to see what it does</span></div>
        ${attrRows()}
        <div class="dim" style="font-size:calc(var(--u)*13)">Season: ${S.stats.g} G · ${S.stats.a} A · ${S.stats.d} D in ${S.stats.gp} games. Career titles: ${CAR.titles}.</div>
      </section>
      <section class="card">
        ${next}
        <div class="two">
          <div><h3>${S.phase==='reg'?'Schedule':'Bracket'}</h3><div class="sched">${S.phase==='reg'?sched:po}</div></div>
          <div><h3>Standings</h3><table><tbody>${ranks}</tbody></table><div class="dim" style="font-size:calc(var(--u)*12)">Top 8 make the Pacific Championships.</div></div>
        </div>
      </section>
    </div>
  </div></div>`);
  ui.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.up,c=upCost(CAR.me[a]);if(CAR.sp>=c&&CAR.me[a]<10){CAR.sp-=c;CAR.me[a]++;saveCareer();SFX.level();showHub()}}));
  on('play',playCareerGame);
  on('nexts',()=>{if(CAR.year>=4)showGraduation();else{advanceSeason();showHub()}});
  on('roster',showRoster);
  on('quit',()=>{saveCareer();showTitle()});
}
function showRoster(){
  const ro=myRoster().slice().sort((a,b)=>ovr(b)-ovr(a)),t=TEAM(CAR.teamId);
  show(`<div class="screen"><div class="panel" style="width:calc(var(--u)*760)">
    <div class="row between"><div><div class="eyebrow">Roster</div><h2>${esc(t.name)}</h2></div><button class="btn" id="rb" data-primary>Back</button></div>
    <table><thead><tr><th>Player</th><th>Pos</th><th>Year</th><th class="n">THR</th><th class="n">SPD</th><th class="n">HND</th><th class="n">HOP</th><th class="n">DEF</th><th>Stars</th></tr></thead><tbody>
    ${ro.map(p=>`<tr class="${p.id==='me'?'me':''}"><td>#${p.num} ${esc(pname(p))}</td><td>${POS[p.pos]}</td><td>${GRADE[p.grade]||''}</td>${ATTR.map(a=>`<td class="n">${p[a]}</td>`).join('')}<td class="stars">${starStr(starsOf(p))}</td></tr>`).join('')}
    </tbody></table>
    <p class="dim" style="font-size:calc(var(--u)*13)">Seniors graduate each spring and freshmen join. Teammates improve a little every year.</p>
  </div></div>`);
  on('rb',showHub);
}
function advanceSeason(){
  CAR.year++;CAR.me.grade++;CAR.sp+=3;
  for(const t of TEAMS){
    const ro=CAR.rosters[t.id],used=new Set(ro.map(p=>p.num).concat(t.id===CAR.teamId?[CAR.me.num]:[]));
    for(let i=0;i<ro.length;i++){
      const p=ro[i];p.grade++;
      if(p.grade>12){used.delete(p.num);const tier=(t.elite&&Math.random()<.6)||(CAR.prestige[t.id]>=4&&Math.random()<.3)?1:0;ro[i]=genPlayer(Math.random,p.pos,tier,used,9)}
      else for(let k=0;k<2;k++)if(Math.random()<.7){const a=pick(ATTR);p[a]=clamp(p[a]+1,1,10)}
    }
    CAR.prestige[t.id]=clamp(CAR.prestige[t.id]+randi(-1,1),t.elite?4:1,5);
  }
  newSeason();saveCareer();
}
function showGraduation(){
  const o=ovr(CAR.me),T=CAR.totals;
  const tier=o>=8.5?'Invited to a youth national team tryout, with top college programs calling':o>=7.5?'Recruited to play for a top college program':o>=6.5?'Starting for a college club team as a freshman':'Walking on to a college club team';
  const hist=CAR.history.map(h=>`<tr><td>${esc(h.grade)}</td><td class="n">${h.w}-${h.l}</td><td>${esc(h.finish)}</td><td class="n">${h.g}</td><td class="n">${h.a}</td><td class="n">${h.d}</td></tr>`).join('');
  SFX.level();
  show(`<div class="screen"><div class="panel" style="width:calc(var(--u)*720)">
    <div class="eyebrow">Graduation · ${esc(TEAM(CAR.teamId).name)}</div><h2>${esc(pname(CAR.me))}, class of ${new Date().getFullYear()+1}</h2>
    <p class="gold">${tier}.</p>
    <table><thead><tr><th>Year</th><th class="n">W-L</th><th>Finish</th><th class="n">G</th><th class="n">A</th><th class="n">D</th></tr></thead><tbody>${hist}</tbody></table>
    <p>Career: ${T.g} goals, ${T.a} assists, ${T.d} blocks in ${T.gp} games. ${CAR.titles} Pacific title${CAR.titles===1?'':'s'}. Final OVR ${o.toFixed(1)}.</p>
    ${CAR.awards.length?`<p class="dim">Awards: ${CAR.awards.map(esc).join(' · ')}</p>`:''}
    <div class="row end"><button class="btn" id="grad" data-primary>Start a new career</button></div>
  </div></div>`);
  on('grad',()=>{CAR=null;saveCareer();showCreate()});
}

// ---------------------------------------------------------------- layout + boot
function fit(){
  const r=wrap.getBoundingClientRect();
  const s=Math.max(.2,Math.min(r.width/W,r.height/H));
  frame.style.width=Math.floor(W*s)+'px';frame.style.height=Math.floor(H*s)+'px';frame.style.setProperty('--u',s+'px');
}
window.addEventListener('resize',fit);
function boot(data){
  fit();
  if(data&&data.career)try{localStorage.setItem(SAVE_KEY,JSON.stringify(data.career))}catch(e){}
  showTitle();
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({career:CAR||loadCareer()}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
window.__huck={get G(){return G},get CAR(){return CAR},throwDisc,startCareer,showHub};
})();
</script>
